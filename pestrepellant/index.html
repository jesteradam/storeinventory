<!DOCTYPE html> <html lang="en"> <head> <meta charset="UTF-8"> <meta name="viewport" content="width=device-width, initial-scale=1.0"> <title>Ultimate Pest Repellent</title> <link rel="manifest" href="./manifest.json"> <meta name="theme-color" content="#0f1115"> <link rel="apple-touch-icon" href="./icon-192.png"> <style> body{font-family:system-ui;background:#0f1115;color:#e8e8e8;display:flex;justify-content:center;align-items:center;min-height:100vh;margin:0;padding:10px}.card{background:#1a1e27;border:1px solid #2a2f3e;border-radius:16px;padding:16px;width:100%;max-width:460px}.tabs{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;margin-bottom:10px}.tab{padding:10px 4px;border-radius:10px;border:1px solid #2a2f3e;background:#0f1115;color:#9aa3b5;font-weight:700;font-size:11px;cursor:pointer;text-align:center}.tab.active{border-width:2px}.tab[data-mode="gecko"].active{background:#6ee7a0;color:#0a2214;border-color:#6ee7a0}.tab[data-mode="rat"].active{background:#fbbf24;color:#221a00;border-color:#fbbf24}.tab[data-mode="roach"].active{background:#fb7185;color:#fff;border-color:#fb7185}.tab[data-mode="mosquito"].active{background:#60a5fa;color:#0a1930;border-color:#60a5fa}.tab[data-mode="ant"].active{background:#f97316;color:#fff;border-color:#f97316}.tab[data-mode="ultimate"].active{background:#a78bfa;color:#160a2a;border-color:#a78bfa;grid-column: span 3;}.display{background:#0f1115;border-radius:12px;padding:14px;text-align:center;border:1px solid #232837;margin-bottom:10px}.freq{font-size:36px;font-weight:800}.small{font-size:11px;color:#9aa3b5}.countdown{font-size:22px;font-weight:800;margin:6px 0}.countdown.on{color:#6ee7a0}.countdown.off{color:#fbbf24}.timer-box{background:#151925;border:1px solid #232837;border-radius:12px;padding:10px;margin:10px 0} input[type=range]{width:100%;margin:6px 0} button{width:100%;padding:12px;border-radius:12px;border:0;font-weight:800;font-size:13px;cursor:pointer;margin-top:7px} #toggle{background:#6ee7a0;color:#0a2214}#t  </style> </head> <body> <div id="toastWrap"><div id="toast" class="toast"><div>⚠️</div><div id="toastMsg">Error</div></div></div> <div class="card"> <h1 style="font-size:17px;margin:0 0 2px;">🦎🐀🪳🦟🐜 Ultimate Pest Repellant</h1> <div class="small" style="margin-bottom:8px;">Full Sweep Cycle</div> <div class="tabs"> <button class="tab" data-mode="gecko">🦎 Gecko</button> <button class="tab" data-mode="rat">🐀 Rat</button> <button class="tab" data-mode="roach">🪳 Roach</button> <button class="tab" data-mode="mosquito">🦟 Mosquito</button> <button class="tab" data-mode="ant">🐜 Ant</button> <button class="tab active" data-mode="ultimate">💥 ALL</button> </div> <div class="display"> <div class="freq" id="freqLabel">8000</div> <div class="small" id="modeLabel">ULTIMATE CYCLE</div> <div class="countdown on" id="countdown">--:--</div> <div class="small" id="phaseLabel">Ready - tap START</div> <div id="cycleBar" style="margin-top:8px; display:flex; gap:3px; justify-content:center;"></div> <div class="small" id="dirLabel" style="margin-top:4px;">↗ Rising</div> </div> <input type="range" id="freqSlider" min="7000" max="45000" value="8000" step="50"> <div style="display:flex;justify-content:space-between;font-size:10px;color:#9aa3b5;"><span id="minLab">8kHz</span><span id="maxLab">42kHz</span></div> <input type="range" id="volSlider" min="0" max="100" value="70"> <div class="timer-box"> <div style="display:flex;justify-content:space-between;font-size:11px;font-weight:700;"><span>⏱️TIMER</span><span id="timerState">OFF</span></div> <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px;"> <label style="font-size:11px;color:#9aa3b5;">ON min <input type="number" id="onMins" value="45" style="width:100%;background:#0f1115;border:1px solid #2a2f3e;color:#fff;border-radius:8px;padding:6px;"></label> <label style="font-size:11px;color:#9aa3b5;">OFF min <input type="number" id="offMins" value="30" style="width:100%;background:#0f1115;border:1px solid #2a2f3e;color:#fff;border-radius:8px;padding:6px;"></label> </div> </div> <button id="toggle">▶ START SOUND</button> <button id="sweep">↻ SWEEP: ON</button> <button id="timerToggle">⏱️ ENABLE TIMER CYCLE</button> <div class="small" id="status" style="text-align:center;margin-top:8px;">Ultimate Pest Repellant V7 </div> </div> <script>
 function showError(msg){const t=document.getElementById('toast');document.getElementById('toastMsg').textContent=msg;t.classList.add('show');const card=document.querySelector('.card');card.classList.remove('shake');void card.offsetWidth;card.classList.add('shake');clearTimeout(window._tt);window._tt=setTimeout(()=>t.classList.remove('show'),3000);} window.alert=showError;
   let audioCtx, osc, gain; let isPlaying=false, sweepTimer=null, countTimer=null; let currentMode='ultimate', sweepOn=true, timerOn=false, onPhase=true, remain=0; const CFG = { gecko: { min:8000, max:15000, def:8000, type:'square', label:'GECKO 8-15kHz', color:'#6ee7a0' }, rat: { min:22000, max:32000, def:22000, type:'sine', label:'RAT 22-32kHz', color:'#fbbf24' }, roach: { min:30000, max:42000, def:30000, type:'sine', label:'ROACH 30-42kHz', color:'#fb7185' }, mosquito: { min:14500, max:19500, def:14500, type:'sine', label:'MOSQUITO 14.5-19.5kHz', color:'#60a5fa' }, ant: { min:12000, max:25000, def:12000, type:'triangle', label:'ANT 12-25kHz', color:'#f97316' }, ultimate: { min:8000, max:42000, def:8000, type:'square', label:'ULTIMATE 5-PEST', color:'#a78bfa' } }; const $=id=>document.getElementById(id); const freqSlider=$('freqSlider'), volSlider=$('volSlider'), freqLabel=$('freqLabel'), modeLabel=$('modeLabel'), countdown=$('countdown'), phaseLabel=$('phaseLabel'), dirLabel=$('dirLabel'), toggleBtn=$('toggle'), sweepBtn=$('sweep'), timerToggle=$('timerToggle'), timerState=$('timerState'), statusEl=$('status'), onMins=$('onMins'), offMins=$('offMins'), cycleBar=$('cycleBar'); function initAudio(){ if(!audioCtx) audioCtx=new(window.AudioContext||window.webkitAudioContext)(); if(audioCtx.state==='suspended') audioCtx.resume(); } function stopAll(){ if(osc){ try{osc.stop();}catch(e){} try{osc.disconnect();}catch(e){} osc=null; } isPlaying=false; clearInterval(sweepTimer); sweepTimer=null; } function playCurrent(){ initAudio(); stopAll(); const cfg=CFG[currentMode]; osc=audioCtx.createOscillator(); gain=audioCtx.createGain(); osc.type=cfg.type; osc.frequency.value=parseInt(freqSlider.value); gain.gain.value=volSlider.value/100*0.5; osc.connect(gain); gain.connect(audioCtx.destination); osc.start(); isPlaying=true; toggleBtn.textContent='■ STOP SOUND'; toggleBtn.classList.add('active'); modeLabel.textContent=cfg.label; if(sweepOn) startSweep(); } function setMode(m){ currentMode=m; document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active')); document.querySelector(`.tab[data-mode="${m}"]`).classList.add('active'); const cfg=CFG[m]; freqSlider.min=cfg.min; freqSlider.max=cfg.max; freqSlider.value=cfg.def; freqLabel.textContent=cfg.def; $('minLab').textContent=(cfg.min/1000)+'kHz'; $('maxLab').textContent=(cfg.max/1000)+'kHz'; modeLabel.textContent=cfg.label; if(isPlaying || timerOn){ playCurrent(); } renderCycleBar(); } function renderCycleBar(){ const pests=['🦎','🐀','🪳','🦟','🐜']; cycleBar.innerHTML=pests.map((p,i)=>`<span id="dot${i}" style="width:22px;height:6px;border-radius:3px;background:#2a2f3e;display:inline-block;"></span>`).join(''); } function startSweep(){ clearInterval(sweepTimer); if(!osc) return; let dir=1, f=parseInt(freqSlider.value); if(currentMode==='ultimate'){ const phases=[ {name:'🦎 GECKO 8-15kHz', min:8000, max:15000, type:'square', step:140, color:'#6ee7a0'}, {name:'🐀 RAT 22-32kHz', min:22000, max:32000, type:'sine', step:260, color:'#fbbf24'}, {name:'🪳 ROACH 30-42kHz', min:30000, max:42000, type:'sine', step:320, color:'#fb7185'}, {name:'🦟 MOSQUITO 14.5-19.5kHz', min:14500, max:19500, type:'sine', step:120, color:'#60a5fa'}, {name:'🐜 ANT 12-25kHz', min:12000, max:25000, type:'triangle', step:200, color:'#f97316'} ]; let pIdx=0; f=phases[0].min; dir=1; osc.type=phases[0].type; phaseLabel.textContent='💥 '+phases[0].name+' ['+(pIdx+1)+'/5]'; dirLabel.textContent='↗ Rising to '+phases[0].max; renderCycleBar(); document.getElementById('dot0').style.background=phases[0].color; sweepTimer=setInterval(()=>{ if(!isPlaying||!osc) return; const cur=phases[pIdx]; f+=dir*cur.step; if(f>=cur.max){ f=cur.max; dir=-1; dirLabel.textContent='↘ Falling to '+cur.min; } if(f<=cur.min && dir===-1){ f=cur.min; dir=1; const prevIdx=pIdx; pIdx=(pIdx+1)%5; const next=phases[pIdx]; f=next.min; osc.type=next.type; phaseLabel.textContent='💥 '+next.name+' ['+(pIdx+1)+'/5]'; dirLabel.textContent='↗ Rising to '+next.max; statusEl.textContent='Completed '+phases[prevIdx].name+' cycle → Now '+next.name; for(let i=0;i<5;i++){ const dot=document.getElementById('dot'+i); if(dot) dot.style.background = i===pIdx? next.color : '#2a2f3e'; } document.querySelector('.display').style.borderColor = next.color; setTimeout(()=>document.querySelector('.display').style.borderColor='#232837', 300); } freqSlider.value=f; freqLabel.textContent=f; osc.frequency.value=f; if(dir===1 && f!==phases[pIdx].min) dirLabel.textContent='↗ Rising to '+phases[pIdx].max+' ('+Math.round((f-phases[pIdx].min)/(phases[pIdx].max-phases[pIdx].min)*100)+'%)'; if(dir===-1) dirLabel.textContent='↘ Falling to '+phases[pIdx].min+' ('+Math.round((phases[pIdx].max-f)/(phases[pIdx].max-phases[pIdx].min)*100)+'%)'; if((pIdx===1||pIdx===2) && Math.random()>0.7 && gain){ gain.gain.setTargetAtTime(0, audioCtx.currentTime, 0.02); gain.gain.linearRampToValueAtTime(volSlider.value/100*0.5, audioCtx.currentTime+0.14); } if(pIdx===3) osc.frequency.value = f + Math.sin(Date.now()/120)*300; },90); } else { const cfg=CFG[currentMode]; phaseLabel.textContent=''+cfg.label+''; sweepTimer=setInterval(()=>{ if(!isPlaying||!osc) return; f+=dir*(currentMode==='rat'?250:currentMode==='roach'?340:currentMode==='mosquito'?110:currentMode==='ant'?190:140); if(f>=cfg.max){ f=cfg.max; dir=-1; dirLabel.textContent='↘ Falling'; } if(f<=cfg.min && dir===-1){ f=cfg.min; dir=1; dirLabel.textContent='↗ Rising - MIN return hit'; statusEl.textContent='Completed full cycle for '+cfg.label; } if(dir===1) dirLabel.textContent='↗ Rising to '+cfg.max; else dirLabel.textContent='↘ Falling to '+cfg.min; freqSlider.value=f; freqLabel.textContent=f; osc.frequency.value=f; if(currentMode==='mosquito') osc.frequency.value = f + Math.sin(Date.now()/150)*250; if((currentMode==='rat'||currentMode==='roach') && Math.random()>0.75 && gain){ gain.gain.setTargetAtTime(0, audioCtx.currentTime, 0.02); gain.gain.linearRampToValueAtTime(volSlider.value/100*0.5, audioCtx.currentTime+0.12); } },90); } sweepBtn.textContent='■ SWEEP: ON'; sweepOn=true; } function fmt(s){ const m=Math.floor(s/60), sec=s%60; return String(m).padStart(2,'0')+':'+String(sec).padStart(2,'0'); } function startTimer(){ const onSec=parseInt(onMins.value)*60, offSec=parseInt(offMins.value)*60; onPhase=true; remain=onSec; timerState.textContent='ON '+fmt(remain); timerState.style.color='#6ee7a0'; countdown.className='countdown on'; countdown.textContent=fmt(remain); playCurrent(); countTimer=setInterval(()=>{ remain--; countdown.textContent=fmt(remain); timerState.textContent=(onPhase?'ON ':'OFF ')+fmt(remain); if(remain<=0){ if(onPhase){ onPhase=false; remain=offSec; stopAll(); toggleBtn.textContent='▶ START SOUND'; toggleBtn.classList.remove('active'); countdown.className='countdown off'; phaseLabel.textContent='😴 REST'; } else { onPhase=true; remain=onSec; playCurrent(); countdown.className='countdown on'; } } },1000); } function stopTimer(){ clearInterval(countTimer); countTimer=null; countdown.textContent='--:--'; timerState.textContent='OFF'; timerState.style.color='#9aa3b5'; } freqSlider.addEventListener('input',()=>{ freqLabel.textContent=freqSlider.value; if(osc) osc.frequency.value=freqSlider.value; }); volSlider.addEventListener('input',()=>{ if(gain) gain.gain.value=volSlider.value/100*0.5; }); toggleBtn.addEventListener('click',()=>{ if(timerOn){ alert('Disable TIMER first'); return; } if(!isPlaying){ playCurrent(); countdown.textContent='∞ ON'; } else { stopAll(); toggleBtn.textContent='▶ START SOUND'; toggleBtn.classList.remove('active'); countdown.textContent='--:--'; phaseLabel.textContent='Stopped'; } }); sweepBtn.addEventListener('click',()=>{ if(sweepTimer){ clearInterval(sweepTimer); sweepTimer=null; sweepBtn.textContent='↻ SWEEP: OFF'; sweepOn=false; } else { sweepOn=true; startSweep(); } }); timerToggle.addEventListener('click',()=>{ timerOn=!timerOn; if(timerOn){ timerToggle.classList.add('active'); timerToggle.textContent='⏱️ TIMER ACTIVE - TAP TO STOP'; startTimer(); } else { timerToggle.classList.remove('active'); timerToggle.textContent='⏱️ ENABLE TIMER CYCLE'; stopTimer(); stopAll(); toggleBtn.textContent='▶ START SOUND'; toggleBtn.classList.remove('active'); } }); document.querySelectorAll('.tab').forEach(tab=>tab.addEventListener('click',()=>setMode(tab.dataset.mode))); setMode('ultimate'); if('serviceWorker' in navigator){ window.addEventListener('load', ()=>{ navigator.serviceWorker.register('./sw.js').then(()=>console.log('SW registered')).catch(e=>console.log('SW fail', e)); }); } </script> </body> </html>
