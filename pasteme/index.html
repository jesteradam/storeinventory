<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Paste Me</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#7c5cff">
<link rel="apple-touch-icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='20' fill='%237c5cff'/><text x='50%' y='55%' dominant-baseline='middle' text-anchor='middle' font-size='60'>📋</text></svg>">

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/atom-one-dark.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/languages/xml.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/languages/css.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/languages/json.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/languages/python.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/lz-string/1.5.0/lz-string.min.js"></script>
<style>
:root{--bg:#0a0a0b;--panel:#141416;--card:#1e1e21;--card2:#252529;--border:#2b2b30;--text:#f5f5f7;--muted:#8a8a90;--accent:#7c5cff;--danger:#ff4d4d;--warn:#ffb020;--ok:#4ade80}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);height:100dvh;display:flex;flex-direction:column;font-family:Inter,system-ui;overflow:hidden}
header{height:58px;display:flex;align-items:center;justify-content:space-between;padding:0 12px;background:var(--panel);border-bottom:1px solid var(--border)}
.logo{font-weight:900;display:flex;gap:8px;align-items:center}.logo i{background:linear-gradient(135deg,var(--accent),#a78bfa);width:32px;height:32px;border-radius:10px;display:grid;place-items:center}
.h-actions{display:flex;gap:6px}
.btn{border:1px solid var(--border);background:var(--card);color:var(--text);padding:9px 12px;border-radius:12px;font-weight:600;font-size:12px;cursor:pointer}.btn.p{background:var(--accent);border-color:var(--accent);color:#fff}.btn:disabled{opacity:.35;pointer-events:none}
.btn.danger{background:rgba(255,77,77,.12);border-color:rgba(255,77,77,.35);color:var(--danger)}.btn.ok{background:rgba(74,222,128,.12);border-color:rgba(74,222,128,.35);color:var(--ok)}
.btn.sm{padding:10px 12px;font-size:12px;border-radius:10px;font-weight:700;display:flex;justify-content:center;width:100%}.btn.icon{width:32px;height:32px;padding:0;display:grid;place-items:center;border-radius:8px}
.wrap{flex:1;display:flex;overflow:hidden;position:relative}.side{width:370px;background:var(--panel);border-right:1px solid var(--border);display:flex;flex-direction:column;z-index:20}
.s-head{padding:10px;display:flex;gap:6px}.s-head input{flex:1;background:var(--card);border:1px solid var(--border);color:var(--text);padding:10px 12px;border-radius:12px;outline:none}
.tabs{display:flex;gap:6px;padding:0 10px 10px}
.bulk-bar{margin:0 10px 10px;padding:10px;background:var(--card2);border:1px solid var(--border);border-radius:14px;display:grid;grid-template-columns:1fr 1fr;gap:8px}
.bulk-bar.hidden{display:none}.bulk-bar label{grid-column:1 / -1;display:flex;gap:8px;font-size:12px;font-weight:600;padding-bottom:8px;border-bottom:1px solid var(--border)}
#selCountAll,#selCountTrash{grid-column:1 / -1;font-size:10px;color:var(--muted);text-align:center}
.list{flex:1;overflow:auto;padding:8px}.item{padding:11px 13px;background:var(--card);border-radius:12px;margin-bottom:8px;border:1px solid transparent;display:flex;gap:10px;align-items:center}.item.active{border-color:var(--accent)}.item.trash-item{border-left:3px solid var(--warn)}
.item-main{flex:1;min-width:0;cursor:pointer}.item-actions{display:flex;gap:5px}.check{width:18px;height:18px;accent-color:var(--accent)}
.badge{font-family:monospace;font-size:11px;padding:3px 8px;border-radius:7px;font-weight:700;display:inline-block;margin-top:5px}.badge.live{background:rgba(124,92,255,.15);color:var(--accent);border:1px solid rgba(124,92,255,.3)}.badge.warn{background:rgba(255,176,32,.15);color:var(--warn);border:1px solid rgba(255,176,32,.3)}.badge.share{background:rgba(74,222,128,.15);color:var(--ok);border:1px solid rgba(74,222,128,.3)}
.main{flex:1;display:flex;flex-direction:column;overflow:hidden;min-width:0}.top{padding:10px;display:flex;gap:8px}.top input{flex:1;min-width:0;background:var(--panel);border:1px solid var(--border);color:var(--text);border-radius:12px;padding:12px;outline:none}.top select{flex:0 0 85px;background:var(--panel);border:1px solid var(--border);color:var(--text);border-radius:12px;padding:11px;font-size:11px}.top select#expire{flex:0 0 95px}
.edit{flex:1;margin:0 10px 10px;background:var(--panel);border:1px solid var(--border);border-radius:16px;display:flex;flex-direction:column;overflow:hidden;min-height:0;position:relative}
.edit-head{display:flex;gap:8px;padding:10px 12px;border-bottom:1px solid var(--border);background:var(--panel);align-items:center}
textarea{flex:1;background:#282c34;border:none;color:#abb2bf;padding:14px;font-family:monospace;font-size:13px;line-height:1.7;resize:none;outline:none;z-index:1}
#preview{flex:1;margin:0;background:#282c34;overflow:auto;display:none;padding:0;z-index:1}
.line{display:flex;min-height:24px}.ln{width:54px;min-width:54px;text-align:right;padding:0 12px 0 0;color:#5c6370;border-right:1px solid #3b4048;margin-right:12px;user-select:none;font-family:monospace;font-size:13px;line-height:1.7;background:#21252b;position:sticky;left:0}.lc{flex:1;white-space:pre-wrap;word-break:break-word;padding-right:14px;font-family:monospace;font-size:13px;line-height:1.7}
.hljs{background:transparent!important;padding:0!important}
.bar{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:12px;border-top:1px solid var(--border);background:var(--panel)}
.stat{grid-column:1 / -1;text-align:center;font-size:11px;color:var(--muted)}
.limit-bar{height:4px;background:var(--border)}.limit-fill{height:100%;background:linear-gradient(90deg,var(--accent),#a78bfa)}
.link-box{margin:0 10px 8px;background:var(--card);border:1px solid var(--border);border-radius:12px;padding:10px 12px;display:flex;gap:8px;align-items:center;display:none}.link-box.show{display:flex}.link-box input{flex:1;background:transparent;border:none;color:var(--ok);font-size:11px;outline:none;min-width:0}
.share-banner{margin:0 10px 8px;background:rgba(74,222,128,.1);border:1px solid rgba(74,222,128,.3);border-radius:12px;padding:10px 12px;display:none;align-items:center;gap:10px}.share-banner.show{display:flex}
.countdown{font-family:monospace;font-size:11px;font-weight:800;padding:6px 10px;border-radius:10px;background:var(--card);border:1px solid var(--border);margin-left:auto}
#trashLock{position:absolute;inset:54px 0 58px 0;background:rgba(20,20,22,.92);backdrop-filter:blur(12px);z-index:10;display:none;place-items:center;padding:24px}#trashLock.show{display:grid}
.lock-card{background:linear-gradient(180deg,#232326,#161618);border:1px solid #333;border-radius:20px;padding:22px 20px;max-width:320px}
.lock-actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
#overlay{position:fixed;inset:0;background:rgba(0,0,0,.8);backdrop-filter:blur(12px);z-index:100;display:none;place-items:center;padding:16px}#overlay.show{display:grid}
.modal{width:100%;max-width:400px;background:linear-gradient(180deg,#2a2a2e,#18181a);border:1px solid #3a3a40;border-radius:24px;overflow:hidden;box-shadow:0 20px 60px rgba(0,0,0,.6);animation:pop.2s ease}
@keyframes pop{0%{transform:scale(.9);opacity:0}100%{transform:scale(1);opacity:1}}
.modal-icon{height:90px;display:grid;place-items:center;font-size:46px}
.modal-body{padding:8px 24px 4px;text-align:center}.modal-body h3{margin:0 0 10px;font-size:19px;font-weight:800}.modal-body p{margin:0;color:var(--muted);font-size:13.5px;line-height:1.6}
.modal-meta{margin-top:14px;display:inline-flex;background:var(--card);border:1px solid var(--border);padding:6px 12px;border-radius:20px;font-size:11px;color:var(--muted);font-family:monospace}
.modal-actions{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:20px}
#toasts{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);z-index:200;display:flex;flex-direction:column;gap:8px;width:90%;max-width:360px}
.toast{background:#1e1e21;border:1px solid #333;padding:12px 14px;border-radius:14px;font-size:13px;display:flex;gap:10px;align-items:center}
@media(max-width:768px){.side{position:absolute;left:-100%;width:86%;height:100%;transition:.3s}.side.open{left:0}}
</style>
</head>
<body>
<header><div class="logo"><i>📋</i> MyPaste 20KB</div><div class="h-actions"><button class="btn" onclick="side.classList.toggle('open')">☰</button><button class="btn" onclick="newPaste()">New</button><button class="btn p" id="btnSave" onclick="savePaste()">Save</button></div></header>
<div class="wrap">
<div class="side" id="side"><div class="s-head"><input id="q" placeholder="🔍 Search..." oninput="render()"><button class="btn" onclick="side.classList.remove('open')">✕</button></div>
<div class="tabs"><button class="btn active" id="tabAll" onclick="setTab('all')">📄 Pastes <span id="countAll"></span></button><button class="btn" id="tabTrash" onclick="setTab('trash')">🗑️ Trash <span id="countTrash"></span></button></div>
<div class="bulk-bar" id="bulkAll"><label><input type="checkbox" id="chkAll" onchange="toggleSelectAll(this.checked)"> Select All</label><button class="btn sm danger" style="grid-column:1 / -1" onclick="bulkDeletePastes()">🗑️ Delete Selected</button><span id="selCountAll"></span></div>
<div class="bulk-bar hidden" id="bulkTrash"><label><input type="checkbox" id="chkTrash" onchange="toggleSelectAllTrash(this.checked)"> Select All</label><button class="btn sm ok" onclick="bulkRestore()">♻️ Restore Selected</button><button class="btn sm danger" onclick="bulkDeleteForever()">💥 Delete Forever</button><span id="selCountTrash"></span></div>
<div class="list" id="list"></div></div>
<div class="main">
<div class="top"><input id="title" placeholder="Title"><select id="lang"><option value="js">js</option><option value="html" selected>html</option><option value="css">css</option><option value="json">json</option><option value="python">python</option><option value="text">text</option></select><select id="expire"><option value="5" selected>5 min</option><option value="60">1 hour</option><option value="1440">24h</option><option value="0">Never</option></select></div>
<div class="share-banner" id="shareBanner"><div style="flex:1"><b style="color:var(--ok)">🔗 Shared paste (20KB)</b><br><small style="color:var(--muted)">Someone shared this with you</small></div><button class="btn ok" onclick="saveShared()">💾 Save</button><button class="btn" onclick="$('shareBanner').classList.remove('show')">✕</button></div>
<div class="link-box" id="linkBox"><input id="linkInput" readonly><button class="btn ok" onclick="copyShareLink()">🔗 Copy Share Link (20KB)</button></div>
<div class="edit"><div class="limit-bar"><div class="limit-fill" id="fill" style="width:0%"></div></div><div class="edit-head"><button class="btn active" id="btnEdit" onclick="setMode('edit')">✏️ Edit</button><button class="btn" id="btnView" onclick="setMode('view')">🎨 Preview</button><div class="countdown" id="countdown">20KB Share Ready</div></div><textarea id="content" spellcheck="false" placeholder="Paste up to 1MB, share up to 20KB..."></textarea><div id="preview"></div><div id="trashLock"><div class="lock-card"><div style="font-size:40px">🔒</div><h3>Locked in Trash</h3><p style="color:var(--muted);font-size:13px">Restore to unlock.</p><div class="lock-actions"><button class="btn" onclick="$('trashLock').classList.remove('show')">Close</button><button class="btn ok" onclick="restoreCurrent()">♻️ Restore</button></div><div id="lockTimer" style="margin-top:12px;font-family:monospace;font-size:11px;color:var(--muted)"></div></div></div><div class="bar"><button class="btn p" id="btnCopy" onclick="copyAll()">📋 Copy</button><button class="btn" id="btnCopyLink" onclick="copyShareLink()">🔗 Share (20KB)</button><button class="btn" id="btnDownload" onclick="download()">⬇️ Download</button><button class="btn danger" onclick="del()">🗑️ Delete</button><div class="stat" id="stat">0 / 1MB • 0 lines • Share: 0 / 20KB</div></div></div>
</div>
</div>
<div id="overlay"><div class="modal"><div class="modal-icon" id="mIcon">🗑️</div><div class="modal-body"><h3 id="mTitle"></h3><p id="mMsg"></p><div class="modal-meta" id="mMeta"></div></div><div class="modal-actions"><button class="btn" id="mCancel">Cancel</button><button class="btn danger" id="mOk">Confirm</button></div></div></div>
<div id="toasts"></div>
<script>
const MAX=1024*1024;
const SHARE_LIMIT=20*1024; // 20KB URL limit - Messenger Safe
const DB_NAME='mypaste-v2-trash', STORE='pastes', TRASH_STORE='trash';
function openDB(){return new Promise(res=>{const r=indexedDB.open(DB_NAME,3);r.onupgradeneeded=()=>{const db=r.result;if(!db.objectStoreNames.contains(STORE))db.createObjectStore(STORE,{keyPath:'id'});if(!db.objectStoreNames.contains(TRASH_STORE))db.createObjectStore(TRASH_STORE,{keyPath:'id'});};r.onsuccess=()=>res(r.result);});}
async function dbPut(s,p){const db=await openDB();return new Promise(r=>{const tx=db.transaction(s,'readwrite');tx.objectStore(s).put(p);tx.oncomplete=()=>r();});}
async function dbGetAll(s){const db=await openDB();return new Promise(r=>{const tx=db.transaction(s,'readonly');const q=tx.objectStore(s).getAll();q.onsuccess=()=>r(q.result);});}
async function dbGet(s,id){const db=await openDB();return new Promise(r=>{const tx=db.transaction(s,'readonly');const q=tx.objectStore(s).get(id);q.onsuccess=()=>r(q.result);});}
async function dbDel(s,id){const db=await openDB();return new Promise(r=>{const tx=db.transaction(s,'readwrite');tx.objectStore(s).delete(id);tx.oncomplete=()=>r();});}
let pastes=[],trash=[],cur=null,curIsTrash=false,mode='edit',tab='all',selected=new Set(),selectedTrash=new Set(),sharedData=null;
const $=id=>document.getElementById(id);
const sizeOf=s=>new Blob([s]).size;
const fmt=b=>b<1024?b+' B':b<1048576?(b/1024).toFixed(1)+' KB':(b/1048576).toFixed(2)+' MB';
function makeId(t){const s=(t||'paste').toLowerCase().replace(/[^a-z0-9]+/g,'-').slice(0,20)||'paste';return s+'-'+Math.random().toString(36).slice(2,4);}
function getShareLink(){
const data={t:$('title').value||'Untitled',l:$('lang').value,c:$('content').value};
const json=JSON.stringify(data);
const compressed=LZString.compressToEncodedURIComponent(json);
return location.origin+location.pathname+'#share='+compressed;
}
function getShareSize(){
try{
const data={t:$('title').value||'',l:$('lang').value,c:$('content').value};
const json=JSON.stringify(data);
const comp=LZString.compressToEncodedURIComponent(json);
return new Blob([comp]).size;
}catch{return 0;}
}
function toHHMMSS(ms){if(ms<=0)return'00:00:00';let sec=Math.floor(ms/1000);const d=Math.floor(sec/86400);sec%=86400;const h=Math.floor(sec/3600);sec%=3600;const m=Math.floor(sec/60);const s=sec%60;const pad=n=>String(n).padStart(2,'0');if(d>0)return d+'d '+pad(h)+':'+pad(m)+':'+pad(s);return pad(h)+':'+pad(m)+':'+pad(s);}
function esc(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function toast(msg,type){if(!type)type='ok';const t=document.createElement('div');t.className='toast '+type;t.innerHTML='<div>'+(type==='ok'?'✅':type==='warn'?'⚠️':'❌')+'</div><div>'+msg+'</div>';$('toasts').appendChild(t);setTimeout(()=>{t.style.opacity='0';setTimeout(()=>t.remove(),300);},3000);}
function showModal(o){return new Promise(res=>{$('mIcon').textContent=o.icon;$('mTitle').textContent=o.title;$('mMsg').innerHTML=o.msg;$('mMeta').textContent=o.meta||'';$('mMeta').style.display=o.meta?'inline-flex':'none';$('mOk').textContent=o.okText;$('mOk').className='btn '+o.okClass;$('mCancel').textContent=o.cancelText;$('overlay').classList.add('show');const close=v=>{$('overlay').classList.remove('show');res(v);};$('mOk').onclick=()=>close(true);$('mCancel').onclick=()=>close(false);$('overlay').onclick=e=>{if(e.target.id==='overlay')close(false);};});}
function setMode(m){if(curIsTrash&&m==='view'){toast('Preview restricted in Trash','warn');$('trashLock').classList.add('show');return;}mode=m;$('btnEdit').classList.toggle('active',m==='edit');$('btnView').classList.toggle('active',m==='view');$('content').style.display=m==='edit'?'block':'none';$('preview').style.display=m==='view'?'block':'none';if(m==='view')doHighlight();}
function setTab(t){tab=t;$('tabAll').classList.toggle('active',t==='all');$('tabTrash').classList.toggle('active',t==='trash');$('bulkAll').classList.toggle('hidden',t!=='all');$('bulkTrash').classList.toggle('hidden',t!=='trash');render();}
async function moveToTrash(p){await dbPut(TRASH_STORE,{...p,deletedAt:Date.now(),trashExpiresAt:Date.now()+24*60*60*1000});await dbDel(STORE,p.id);}
async function cleanExpired(){const now=Date.now();for(const p of pastes){if(p.expiresAt&&now>p.expiresAt){await moveToTrash(p);if(cur===p.id){cur=null;newPaste();}}}for(const t of trash){if(t.trashExpiresAt&&now>t.trashExpiresAt){await dbDel(TRASH_STORE,t.id);}}}
async function load(){pastes=await dbGetAll(STORE);trash=await dbGetAll(TRASH_STORE);await cleanExpired();pastes=await dbGetAll(STORE);trash=await dbGetAll(TRASH_STORE);pastes.sort((a,b)=>b.updated-a.updated);trash.sort((a,b)=>b.deletedAt-a.deletedAt);$('countAll').textContent='('+pastes.length+')';$('countTrash').textContent='('+trash.length+')';render();}
function newPaste(){sharedData=null;$('shareBanner').classList.remove('show');$('btnSave').disabled=false;$('btnSave').style.opacity='1';$('btnSave').style.pointerEvents='auto';$('btnCopy').disabled=false;$('btnCopy').style.opacity='1';$('btnCopy').style.pointerEvents='auto';$('title').disabled=false;$('lang').disabled=false;$('expire').disabled=false;$('content').disabled=false;$('content').readOnly=false;cur=null;curIsTrash=false;$('title').value='';$('content').value='';$('linkBox').classList.remove('show');$('trashLock').classList.remove('show');$('btnView').disabled=false;$('btnCopyLink').disabled=false;$('btnDownload').disabled=false;$('content').style.filter='none';$('preview').style.filter='none';location.hash='';$('countdown').textContent='20KB Share Ready';setMode('edit');update();}
async function savePaste(){if(curIsTrash){toast('Cannot save in trash','warn');return;}const c=$('content').value;if(!c.trim()){toast('Empty','warn');return;}if(sizeOf(c)>MAX){toast('Over 1MB','err');return;}let id=(cur&&!curIsTrash&&!sharedData)?cur:makeId($('title').value);const expMin=parseInt($('expire').value);const expiresAt=expMin>0?Date.now()+expMin*60*1000:null;const p={id,title:$('title').value||'Untitled',lang:$('lang').value,content:c,size:sizeOf(c),updated:Date.now(),expiresAt,expireLabel:$('expire').options[$('expire').selectedIndex].text};await dbPut(STORE,p);cur=id;curIsTrash=false;sharedData=null;$('shareBanner').classList.remove('show');location.hash=id;$('linkBox').classList.add('show');$('linkInput').value=getShareLink();await load();update();toast('Saved! 20KB Share link ready 🔗','ok');setMode('view');}
function doHighlight(){
const code=$('content').value;
let lang=$('lang').value;
if(lang==='html')lang='xml';
if(lang==='js')lang='javascript';
let highlighted='';
try{
if(code.trim()===''){highlighted='';}else{
highlighted=hljs.highlight(code,{language:lang,ignoreIllegals:true}).value;
}
}catch(e){
try{highlighted=hljs.highlightAuto(code).value;}catch{highlighted=esc(code);}
}
const lines=highlighted.split('\n');
let out='';
for(let i=0;i<lines.length;i++){
out+=`<div class="line"><div class="ln">${i+1}</div><div class="lc"><span class="hljs">${lines[i]||' '}</span></div></div>`;
}
$('preview').innerHTML=out;
}
function openShared(){
const hash=location.hash;
if(!hash.startsWith('#share='))return false;
const comp=hash.slice(7);
try{
if(new Blob([comp]).size>SHARE_LIMIT){toast('Share link over 20KB limit ⚠️ Messenger will cut','warn');}
const json=LZString.decompressFromEncodedURIComponent(comp);
if(!json)throw 'decompress fail';
const data=JSON.parse(json);
sharedData=data;
$('title').value=data.t||'Shared paste';
$('lang').value=data.l||'html';
$('content').value=data.c||'';
$('linkBox').classList.add('show');
$('linkInput').value=location.href;
$('shareBanner').classList.add('show');
$('countdown').innerHTML='<span class="badge share">🔗 20KB Shared</span>';
cur=null;curIsTrash=false;
setMode('view');
update();
toast('Shared paste opened (20KB) 🔗','ok');
return true;
}catch(e){toast('Invalid share link ❌','err');return false;}
}
async function saveShared(){
if(!sharedData){toast('No shared data','warn');return;}
const c=sharedData.c;
let id=makeId(sharedData.t);
const p={id,title:sharedData.t||'Shared paste',lang:sharedData.l||'html',content:c,size:sizeOf(c),updated:Date.now(),expiresAt:null,expireLabel:'Never'};
await dbPut(STORE,p);
cur=id;sharedData=null;$('shareBanner').classList.remove('show');
await load();toast('Saved to your pastes ✅','ok');location.hash=id;$('linkBox').classList.add('show');$('linkInput').value=getShareLink();
}
function toggleSelect(id,checked){if(checked)selected.add(id);else selected.delete(id);updateSelCount();}
function toggleSelectTrash(id,checked){if(checked)selectedTrash.add(id);else selectedTrash.delete(id);updateSelCount();}
function toggleSelectAll(checked){selected.clear();if(checked){pastes.forEach(p=>selected.add(p.id));}updateSelCount();render();}
function toggleSelectAllTrash(checked){selectedTrash.clear();if(checked){trash.forEach(p=>selectedTrash.add(p.id));}updateSelCount();render();}
function updateSelCount(){$('selCountAll').textContent=selected.size?selected.size+' selected':'';$('selCountTrash').textContent=selectedTrash.size?selectedTrash.size+' selected':'';if($('chkAll'))$('chkAll').checked=selected.size===pastes.length&&pastes.length>0;if($('chkTrash'))$('chkTrash').checked=selectedTrash.size===trash.length&&trash.length>0;}
function render(){
const q=$('q').value.toLowerCase();
if(tab==='all'){
const f=pastes.filter(p=>(p.title+p.id).toLowerCase().includes(q));
let h='';for(const p of f){
const rem=p.expiresAt?p.expiresAt-Date.now():null;const txt=rem===null?'Never':toHHMMSS(rem);
const checked=selected.has(p.id)?'checked':'';
h+=`<div class="item ${p.id===cur&&!curIsTrash?'active':''}">
<input type="checkbox" class="check" ${checked} onchange="toggleSelect('${p.id}',this.checked)" onclick="event.stopPropagation()">
<div class="item-main" onclick="openPaste('${p.id}',false)"><b>${esc(p.title)}</b><br><small>${fmt(p.size)}</small><div><span class="badge live">${txt}</span> <span class="badge share">🔗 20KB</span></div></div>
<div class="item-actions"><button class="btn icon" onclick="event.stopPropagation();copyShareLinkFor('${p.id}')" title="Copy Share Link">🔗</button><button class="btn icon danger" onclick="event.stopPropagation();quickDelete('${p.id}')" title="Delete">🗑️</button></div>
</div>`;}
$('list').innerHTML=h||'<div style="padding:20px;text-align:center;color:#666">No pastes<br><small>Save one, then Share (20KB)</small></div>';
}else{
const f=trash.filter(p=>(p.title+p.id).toLowerCase().includes(q));
let h='';for(const p of f){
const checked=selectedTrash.has(p.id)?'checked':'';
h+=`<div class="item trash-item ${p.id===cur&&curIsTrash?'active':''}">
<input type="checkbox" class="check" ${checked} onchange="toggleSelectTrash('${p.id}',this.checked)" onclick="event.stopPropagation()">
<div class="item-main" onclick="openPaste('${p.id}',true)"><b>${esc(p.title)}</b><br><small>${fmt(p.size)} • Locked</small><div><span class="badge warn">🔒 ${toHHMMSS(p.trashExpiresAt-Date.now())}</span></div></div>
<div class="item-actions"><button class="btn icon ok" onclick="event.stopPropagation();quickRestore('${p.id}')" title="Restore">♻️</button><button class="btn icon danger" onclick="event.stopPropagation();quickDeleteForever('${p.id}')" title="Delete Forever">💥</button></div>
</div>`;}
$('list').innerHTML=h||'<div style="padding:20px;text-align:center;color:#666">Trash empty</div>';
}
updateSelCount();
}
async function openPaste(id,isTrash){
let p=isTrash?trash.find(x=>x.id===id):pastes.find(x=>x.id===id);
if(!p){p=await dbGet(isTrash?TRASH_STORE:STORE,id);}if(!p){toast('Not found','err');return;}
sharedData=null;$('shareBanner').classList.remove('show');
cur=id;curIsTrash=isTrash;$('title').value=p.title;$('lang').value=p.lang;$('content').value=p.content;
if(isTrash){
$('trashLock').classList.add('show');$('btnView').disabled=true;$('btnCopyLink').disabled=true;$('btnDownload').disabled=true;
$('btnSave').disabled=true;$('btnSave').style.opacity='0.35';$('btnSave').style.pointerEvents='none';
$('btnCopy').disabled=true;$('btnCopy').style.opacity='0.35';$('btnCopy').style.pointerEvents='none';
$('title').disabled=true;$('lang').disabled=true;$('expire').disabled=true;$('content').disabled=true;$('content').readOnly=true;
$('content').style.filter='blur(6px)';$('preview').style.filter='blur(6px)';$('countdown').textContent='🔒 '+toHHMMSS(p.trashExpiresAt-Date.now());$('lockTimer').textContent=toHHMMSS(p.trashExpiresAt-Date.now())+' until delete';setMode('edit');
}else{
$('trashLock').classList.remove('show');$('btnView').disabled=false;$('btnCopyLink').disabled=false;$('btnDownload').disabled=false;
$('btnSave').disabled=false;$('btnSave').style.opacity='1';$('btnSave').style.pointerEvents='auto';$('btnCopy').disabled=false;$('btnCopy').style.opacity='1';$('btnCopy').style.pointerEvents='auto';
$('title').disabled=false;$('lang').disabled=false;$('expire').disabled=false;$('content').disabled=false;$('content').readOnly=false;$('content').style.filter='none';$('preview').style.filter='none';
location.hash=id;$('linkBox').classList.add('show');$('linkInput').value=getShareLink();setMode('view');
}
document.getElementById('side').classList.remove('open');render();update();
}
function update(){
const b=sizeOf($('content').value);
const shareSize=getShareSize();
$('fill').style.width=Math.min(100,b/MAX*100)+'%';
const sharePct=Math.min(100,shareSize/SHARE_LIMIT*100);
let shareColor=shareSize>SHARE_LIMIT?'var(--danger)':'var(--ok)';
$('stat').innerHTML=`${fmt(b)} / 1MB • ${fmt(shareSize)} / 20KB share <span style="color:${shareColor}">(${sharePct.toFixed(0)}%)</span> • ${$('content').value.split('\n').length} lines`;
if(cur&&!curIsTrash&&!sharedData){const p=pastes.find(x=>x.id===cur);if(p&&p.expiresAt){$('countdown').textContent=toHHMMSS(p.expiresAt-Date.now());}else if(cur){$('countdown').innerHTML=`<span class="badge share">🔗 ${fmt(shareSize)} / 20KB</span>`;}if($('linkBox').classList.contains('show')){$('linkInput').value=getShareLink();}}else if(!sharedData){$('countdown').innerHTML=`<span class="badge share">${fmt(shareSize)} / 20KB</span>`;}
if(mode==='view'&&!curIsTrash)doHighlight();
}
async function quickDelete(id){const p=pastes.find(x=>x.id===id);if(!p)return;const ok=await showModal({icon:'🗑️',title:'Move to Trash?',msg:`<b>${esc(p.title)}</b> will be moved to trash.`,meta:`${fmt(p.size)} • #${p.id}`,okText:'Move to Trash',okClass:'danger',cancelText:'Keep'});if(!ok)return;await moveToTrash(p);selected.delete(id);if(cur===id){cur=null;newPaste();}await load();toast('Moved to trash','warn');}
async function del(){if(!cur&&!sharedData){toast('No paste','warn');return;}if(sharedData){newPaste();return;}if(curIsTrash){deleteForever(cur);return;}quickDelete(cur);}
async function bulkDeletePastes(){if(selected.size===0){toast('Select at least one','warn');return;}const ok=await showModal({icon:'🗑️',title:`Delete ${selected.size} pastes?`,msg:`<b>${selected.size} pastes</b> will be moved to trash.`,meta:`${selected.size} items`,okText:`Delete ${selected.size}`,okClass:'danger',cancelText:'Cancel'});if(!ok)return;for(const id of selected){const p=pastes.find(x=>x.id===id);if(p)await moveToTrash(p);}selected.clear();cur=null;newPaste();await load();toast('Bulk moved to trash','warn');}
async function quickRestore(id){const p=trash.find(x=>x.id===id)||await dbGet(TRASH_STORE,id);if(!p)return;const ok=await showModal({icon:'♻️',title:'Restore paste?',msg:`<b>${esc(p.title)}</b> will be restored.`,meta:`${fmt(p.size)} • #${p.id}`,okText:'Restore',okClass:'ok',cancelText:'Cancel'});if(!ok)return;const r={...p,updated:Date.now(),expiresAt:Date.now()+24*60*60*1000,expireLabel:'24 hours'};delete r.deletedAt;delete r.trashExpiresAt;await dbPut(STORE,r);await dbDel(TRASH_STORE,id);selectedTrash.delete(id);await load();toast('Restored','ok');setTab('all');openPaste(id,false);}
async function quickDeleteForever(id){const p=trash.find(x=>x.id===id)||await dbGet(TRASH_STORE,id);if(!p)return;const ok=await showModal({icon:'💥',title:'Delete Forever?',msg:`<b>${esc(p.title)}</b> will be <span style="color:var(--danger);font-weight:800">permanently deleted</span>.`,meta:`${fmt(p.size)} • #${p.id}`,okText:'Delete Forever',okClass:'danger',cancelText:'Cancel'});if(!ok)return;await dbDel(TRASH_STORE,id);selectedTrash.delete(id);if(cur===id){cur=null;newPaste();}await load();toast('Permanently deleted','err');}
async function deleteForever(id){quickDeleteForever(id);}
async function bulkRestore(){if(selectedTrash.size===0){toast('Select at least one','warn');return;}const ok=await showModal({icon:'♻️',title:`Restore ${selectedTrash.size}?`,msg:`<b>${selectedTrash.size} pastes</b> will be restored.`,meta:`${selectedTrash.size} items`,okText:`Restore ${selectedTrash.size}`,okClass:'ok',cancelText:'Cancel'});if(!ok)return;for(const id of selectedTrash){const p=trash.find(x=>x.id===id)||await dbGet(TRASH_STORE,id);if(p){const r={...p,updated:Date.now(),expiresAt:Date.now()+24*60*60*1000,expireLabel:'24 hours'};delete r.deletedAt;delete r.trashExpiresAt;await dbPut(STORE,r);await dbDel(TRASH_STORE,id);}}selectedTrash.clear();await load();toast('Bulk restored','ok');setTab('all');}
async function bulkDeleteForever(){if(selectedTrash.size===0){toast('Select at least one','warn');return;}const ok=await showModal({icon:'💥',title:`Delete ${selectedTrash.size} forever?`,msg:`<b>${selectedTrash.size} pastes</b> will be <span style="color:var(--danger);font-weight:800">permanently deleted</span>.`,meta:`${selectedTrash.size} items`,okText:`Delete Forever`,okClass:'danger',cancelText:'Cancel'});if(!ok)return;for(const id of selectedTrash){await dbDel(TRASH_STORE,id);}const wasCurrent=selectedTrash.has(cur);selectedTrash.clear();if(wasCurrent){cur=null;newPaste();}await load();toast('Bulk permanently deleted','err');}
function restorePaste(id){quickRestore(id);}
function restoreCurrent(){if(curIsTrash)restorePaste(cur);}
async function copyAll(){if(curIsTrash){toast('Cannot copy from trash','warn');return;}await navigator.clipboard.writeText($('content').value);toast('Copied!','ok');}
function copyLink(){copyShareLink();}
async function copyShareLink(){
if(sharedData){await navigator.clipboard.writeText(location.href);toast('Share link copied! (20KB) 🔗','ok');return;}
if(!$('content').value.trim()){toast('Write something first','warn');return;}
const size=getShareSize();
if(size>SHARE_LIMIT){
const ok=await showModal({icon:'⚠️',title:`Over 20KB (${fmt(size)})`,msg:`Your paste is <b>${fmt(size)}</b>, over 20KB limit.<br>Messenger will cut the link.<br>Share anyway or download file?`,meta:`${fmt(size)} / 20KB • ${(size/SHARE_LIMIT*100).toFixed(0)}%`,okText:'Share Anyway',okClass:'warn',cancelText:'Download'});
if(!ok){download();return;}
}
const link=getShareLink();
$('linkBox').classList.add('show');$('linkInput').value=link;
await navigator.clipboard.writeText(link);
toast(`Share link copied! ${fmt(size)} / 20KB 🔗`,'ok');
}
async function copyShareLinkFor(id){
const p=pastes.find(x=>x.id===id)||await dbGet(STORE,id);
if(!p){toast('Not found','err');return;}
const data={t:p.title,l:p.lang,c:p.content};
const json=JSON.stringify(data);
const comp=LZString.compressToEncodedURIComponent(json);
const s=new Blob([comp]).size;
if(s>SHARE_LIMIT){toast(`Over 20KB! ${fmt(s)} - Messenger will cut`,'warn');}
const link=location.origin+location.pathname+'#share='+comp;
await navigator.clipboard.writeText(link);
toast(`Share link for ${p.title} copied ${fmt(s)} / 20KB 🔗`,'ok');
}
function download(){if(curIsTrash){toast('Download disabled in trash','warn');return;}const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([$('content').value]));a.download=($('title').value||cur||'paste')+'.txt';a.click();toast('Downloaded','ok');}
$('content').addEventListener('input',update);
$('lang').addEventListener('change',()=>{if(mode==='view')doHighlight();update();});
setInterval(()=>{render();update();},1000);
setInterval(()=>{cleanExpired().then(()=>load());},30000);
window.addEventListener('DOMContentLoaded',async()=>{
if(openShared()){pastes=await dbGetAll(STORE);trash=await dbGetAll(TRASH_STORE);$('countAll').textContent='('+pastes.length+')';$('countTrash').textContent='('+trash.length+')';render();return;}
await load();update();
const h=location.hash.slice(1);
if(h&&!h.startsWith('share=')){openPaste(h,false);}else if(!h){setMode('edit');}
});
window.addEventListener('hashchange',()=>{if(location.hash.startsWith('#share=')){openShared();}});
</script>
