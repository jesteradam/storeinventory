<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MyPaste - Ultimate</title>
  <link rel="manifest" href="./manifest.json">
<meta name="theme-color" content="#7c5cff">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<style>
:root{--bg:#0a0a0b;--panel:#141416;--card:#1e1e21;--border:#2b2b30;--text:#f5f5f7;--muted:#8a8a90;--accent:#7c5cff;--danger:#ff4d4d;--warn:#ffb020;--ok:#4ade80}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);height:100dvh;display:flex;flex-direction:column;font-family:Inter,system-ui;overflow:hidden}
header{height:58px;display:flex;align-items:center;justify-content:space-between;padding:0 14px;background:var(--panel);border-bottom:1px solid var(--border)}
.logo{font-weight:900;display:flex;gap:10px;align-items:center}.logo i{background:linear-gradient(135deg,var(--accent),#a78bfa);width:32px;height:32px;border-radius:10px;display:grid;place-items:center}
.btn{border:1px solid var(--border);background:var(--card);color:var(--text);padding:9px 14px;border-radius:12px;font-weight:600;font-size:13px;cursor:pointer;transition:.15s}.btn.p{background:var(--accent);border-color:var(--accent);color:#fff}
.btn:disabled{opacity:.3;pointer-events:none;filter:grayscale(1)}
.btn.danger{background:rgba(255,77,77,.15);border-color:rgba(255,77,77,.4);color:var(--danger)}
.btn.ok{background:rgba(74,222,128,.15);border-color:rgba(74,222,128,.4);color:var(--ok)}
.btn.warn{background:rgba(255,176,32,.15);border-color:rgba(255,176,32,.4);color:var(--warn)}
.wrap{flex:1;display:flex;overflow:hidden;position:relative}.side{width:370px;background:var(--panel);border-right:1px solid var(--border);display:flex;flex-direction:column;z-index:20}
.s-head{padding:10px;display:flex;gap:6px}.s-head input{flex:1;background:var(--card);border:1px solid var(--border);color:var(--text);padding:10px 12px;border-radius:12px;outline:none}
.tabs{display:flex;gap:6px;padding:0 10px 10px}
.list{flex:1;overflow:auto;padding:8px}
.item{padding:12px 13px;background:var(--card);border-radius:14px;margin-bottom:10px;cursor:pointer;border:1px solid transparent}.item.active{border-color:var(--accent);box-shadow:0 0 0 3px rgba(124,92,255,.15)}.item.trash-item{border-left:4px solid var(--warn)}
.badge{font-family:ui-monospace,monospace;font-size:11px;padding:4px 9px;border-radius:8px;font-weight:800;display:inline-block;margin-top:6px}.badge.live{background:rgba(124,92,255,.15);color:var(--accent);border:1px solid rgba(124,92,255,.3)}.badge.warn{background:rgba(255,176,32,.18);color:var(--warn);border:1px solid rgba(255,176,32,.4)}
.trash-btns{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.bulk-bar{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;padding:0 8px 10px}
.bulk-bar.btn{font-size:11.5px;padding:10px 6px;display:flex;justify-content:center;gap:4px}
mark{background:rgba(124,92,255,.35);color:#fff;padding:0 3px;border-radius:4px;font-weight:800}
.main{flex:1;display:flex;flex-direction:column;overflow:hidden;min-width:0}
.top{padding:10px;display:flex;gap:8px}.top input{flex:1;min-width:0;background:var(--panel);border:1px solid var(--border);color:var(--text);border-radius:12px;padding:12px;outline:none}.top select{flex:0 0 95px;background:var(--panel);border:1px solid var(--border);color:var(--text);border-radius:12px;padding:11px;font-size:13px}.top select#expire{flex:0 0 115px}
.edit{flex:1;margin:0 10px 10px;background:var(--panel);border:1px solid var(--border);border-radius:16px;display:flex;flex-direction:column;overflow:hidden;min-height:0;position:relative}
.edit-head{display:flex;gap:8px;padding:10px 12px;border-bottom:1px solid var(--border);background:var(--panel);align-items:center}
textarea{flex:1;background:#282c34;border:none;color:#abb2bf;padding:14px;font-family:ui-monospace,monospace;font-size:13px;line-height:1.7;resize:none;outline:none;z-index:1}
#preview{flex:1;margin:0;background:#282c34;overflow:auto;display:none;padding:0;z-index:1}
.line{display:flex;min-height:23px}.ln{width:52px;min-width:52px;text-align:right;padding:0 12px 0 0;color:#5c6370;border-right:1px solid #3b4048;margin-right:12px;user-select:none;font-family:ui-monospace,monospace;font-size:13px;line-height:1.7;background:#21252b;position:sticky;left:0}.lc{flex:1;white-space:pre-wrap;word-break:break-all;padding-right:14px;font-family:ui-monospace,monospace;font-size:13px;line-height:1.7}
.kw{color:#c678dd;font-weight:700}.fn{color:#61afef;font-weight:600}.str{color:#98c379}.num{color:#d19a66}.com{color:#5c6370;font-style:italic}.tag{color:#e06c75}.attr{color:#d19a66}
.bar{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:12px;border-top:1px solid var(--border);background:var(--panel);z-index:2}
@media(min-width:500px){.bar{grid-template-columns:1fr 1fr 1fr 1fr}}
.bar.trash-mode{grid-template-columns:1fr 1fr}
.stat{grid-column:1 / -1;text-align:center;font-size:11px;color:var(--muted)}
.limit-bar{height:4px;background:var(--border)}.limit-fill{height:100%;background:linear-gradient(90deg,var(--accent),#a78bfa)}
.link-box{margin:0 10px 8px;background:var(--card);border:1px solid var(--border);border-radius:12px;padding:10px 12px;display:flex;gap:8px;align-items:center;display:none}.link-box.show{display:flex}.link-box input{flex:1;background:transparent;border:none;color:var(--accent);font-size:12px;outline:none}
.countdown{font-family:ui-monospace,monospace;font-size:13px;font-weight:800;letter-spacing:1px;padding:6px 12px;border-radius:10px;background:var(--card);border:1px solid var(--border);margin-left:auto}
#trashLock{position:absolute;inset:54px 0 0 0;background:rgba(20,20,22,.92);backdrop-filter:blur(12px);z-index:10;display:none;place-items:center;text-align:center;padding:24px}
#trashLock.show{display:grid}
.lock-card{background:linear-gradient(180deg,#232326,#161618);border:1px solid #333;border-radius:20px;padding:22px 20px;max-width:320px}
.lock-actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
#overlay{position:fixed;inset:0;background:rgba(0,0,0,.7);backdrop-filter:blur(10px);z-index:100;display:none;place-items:center;padding:16px}
#overlay.show{display:grid}
.modal{width:100%;max-width:400px;background:linear-gradient(180deg,#232326,#161618);border:1px solid #333;border-radius:24px;overflow:hidden}
.modal-icon{height:90px;display:grid;place-items:center;font-size:42px}
.modal-body{padding:8px 24px 4px;text-align:center}.modal-body h3{margin:0 0 10px;font-size:18px;font-weight:800}.modal-body p{margin:0;color:var(--muted);font-size:13.5px;line-height:1.6}
.modal-meta{margin-top:14px;display:inline-flex;background:var(--card);border:1px solid var(--border);padding:6px 12px;border-radius:20px;font-size:11px;color:var(--muted);font-family:ui-monospace,monospace}
.modal-actions{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:20px}
#toasts{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);z-index:200;display:flex;flex-direction:column;gap:8px;width:90%;max-width:360px}
.toast{background:#1e1e21;border:1px solid #333;padding:12px 14px;border-radius:14px;font-size:13px;display:flex;gap:10px;align-items:center}
@media(max-width:768px){.side{position:absolute;left:-100%;width:90%;height:100%;transition:.3s}.side.open{left:0}}
</style>
</head>
<body>
<header><div class="logo"><i>📋</i> MyPaste <span style="font-size:11px;color:var(--muted)">ULTIMATE</span></div><div style="display:flex;gap:8px"><button class="btn" onclick="side.classList.toggle('open')">☰</button><button class="btn" onclick="newPaste()">New</button><button class="btn p" id="btnSave" onclick="savePaste()">Save</button></div></header>
<div class="wrap">
  <div class="side" id="side">
    <div class="s-head"><input id="q" placeholder="🔍 Search pastes & trash..." oninput="render()"><button class="btn" onclick="side.classList.remove('open')">✕</button></div>
    <div class="tabs"><button class="btn active" id="tabAll" onclick="setTab('all')">📄 Pastes <span id="countAll"></span></button><button class="btn" id="tabTrash" onclick="setTab('trash')">🗑️ Trash <span id="countTrash"></span></button></div>
    <div id="bulkBar" class="bulk-bar" style="display:none">
      <button class="btn ok" onclick="restoreAll()">♻️ Restore All</button>
      <button class="btn danger" onclick="emptyTrash()">💥 Empty</button>
      <button class="btn warn" onclick="exportZip()">📦 Zip</button>
    </div>
    <div class="list" id="list"></div>
  </div>
  <div class="main">
    <div class="top"><input id="title" placeholder="Untitled"><select id="lang" onchange="if(mode==='view')doHighlight()"><option value="js">js</option><option value="html" selected>html</option><option value="css">css</option><option value="json">json</option><option value="python">python</option><option value="text">text</option></select><select id="expire"><option value="5" selected>5 min</option><option value="10">10 min</option><option value="30">30 min</option><option value="60">1 hour</option><option value="180">3 hours</option><option value="720">12 hours</option><option value="1440">24 hours</option><option value="4320">3 days</option><option value="10080">7 days</option><option value="0">Never</option></select></div>
    <div class="link-box" id="linkBox"><input id="linkInput" readonly><button class="btn" onclick="copyLink()">Copy Link</button></div>
    <div class="edit">
      <div class="limit-bar"><div class="limit-fill" id="fill" style="width:0%"></div></div>
      <div class="edit-head"><button class="btn active" id="btnEdit" onclick="setMode('edit')">✏️ Edit</button><button class="btn" id="btnView" onclick="setMode('view')">🎨 Preview</button><div class="countdown" id="countdown">00:00:00</div></div>
      <textarea id="content" spellcheck="false" placeholder="Paste code here..."></textarea><div id="preview"></div>
      <div id="trashLock"><div class="lock-card"><div style="font-size:40px">🔒</div><h3 style="margin:8px 0">Save & Preview Disabled</h3><p style="color:var(--muted);font-size:13px">Restore to edit, save and see colors.</p><div class="lock-actions"><button class="btn" onclick="$('trashLock').classList.remove('show')">Close</button><button class="btn ok" onclick="restoreCurrent()">♻️ Restore</button></div><div id="lockTimer" style="margin-top:12px;font-family:ui-monospace,monospace;font-size:11px;color:var(--muted)"></div></div></div>
      <div class="bar" id="actionBar"></div>
    </div>
  </div>
</div>
<div id="overlay"><div class="modal"><div class="modal-icon" id="mIcon">🗑️</div><div class="modal-body"><h3 id="mTitle"></h3><p id="mMsg"></p><div class="modal-meta" id="mMeta"></div></div><div class="modal-actions"><button class="btn" id="mCancel">Keep</button><button class="btn danger" id="mOk">Move to Trash</button></div></div></div>
<div id="toasts"></div>
<script>
const MAX=1024*1024;
const DB_NAME='mypaste-v2-trash', STORE='pastes', TRASH_STORE='trash';
function openDB(){return new Promise(res=>{const r=indexedDB.open(DB_NAME,2);r.onupgradeneeded=()=>{const db=r.result;if(!db.objectStoreNames.contains(STORE))db.createObjectStore(STORE,{keyPath:'id'});if(!db.objectStoreNames.contains(TRASH_STORE))db.createObjectStore(TRASH_STORE,{keyPath:'id'});};r.onsuccess=()=>res(r.result);});}
async function dbPut(s,p){const db=await openDB();return new Promise(r=>{const tx=db.transaction(s,'readwrite');tx.objectStore(s).put(p);tx.oncomplete=()=>r();});}
async function dbGetAll(s){const db=await openDB();return new Promise(r=>{const tx=db.transaction(s,'readonly');const q=tx.objectStore(s).getAll();q.onsuccess=()=>r(q.result);});}
async function dbGet(s,id){const db=await openDB();return new Promise(r=>{const tx=db.transaction(s,'readonly');const q=tx.objectStore(s).get(id);q.onsuccess=()=>r(q.result);});}
async function dbDel(s,id){const db=await openDB();return new Promise(r=>{const tx=db.transaction(s,'readwrite');tx.objectStore(s).delete(id);tx.oncomplete=()=>r();});}
async function dbClear(s){const db=await openDB();return new Promise(r=>{const tx=db.transaction(s,'readwrite');tx.objectStore(s).clear();tx.oncomplete=()=>r();});}

let pastes=[],trash=[],cur=null,curIsTrash=false,mode='edit',tab='all';
const $=id=>document.getElementById(id);
const sizeOf=s=>new Blob([s]).size;
const fmt=b=>b<1024?b+' B':b<1048576?(b/1024).toFixed(1)+' KB':(b/1048576).toFixed(2)+' MB';
function makeId(t){const s=(t||'paste').toLowerCase().replace(/[^a-z0-9]+/g,'-').slice(0,20)||'paste';return s+'-'+Math.random().toString(36).slice(2,4);}
function getLink(id){return location.origin+location.pathname+'#'+id;}
function toHHMMSS(ms){if(ms<=0)return'00:00:00';let sec=Math.floor(ms/1000);const d=Math.floor(sec/86400);sec%=86400;const h=Math.floor(sec/3600);sec%=3600;const m=Math.floor(sec/60);const s=sec%60;const pad=n=>String(n).padStart(2,'0');if(d>0)return d+'d '+pad(h)+':'+pad(m)+':'+pad(s);return pad(h)+':'+pad(m)+':'+pad(s);}
function esc(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function highlightSearch(text, query){
  if(!query) return esc(text);
  const safe=esc(text);
  const re=new RegExp('('+query.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+')','gi');
  return safe.replace(re,'<mark>$1</mark>');
}
function highlight(code, lang){
  let h=esc(code);
  if(lang==='html'){h=h.replace(/(&lt;\/?)([a-zA-Z0-9-]+)/g,'$1<span class="tag">$2</span>');h=h.replace(/([a-z-]+)=/g,'<span class="attr">$1</span>=');h=h.replace(/"([^"]*)"/g,'"<span class="str">$1</span>"');return h;}
  h=h.replace(/(\/\/.*$|\/\*[\s\S]*?\*\/|#.*$)/gm,'<span class="com">$1</span>');
  h=h.replace(/"([^"]*)"/g,'"<span class="str">$1</span>"');h=h.replace(/'([^']*)'/g,"'<span class=\"str\">$1</span>'");
  h=h.replace(/\b(function|const|let|var|if|else|return|for|while|class|import|export|from|async|await|def|print|true|false|null)\b/g,'<span class="kw">$1</span>');
  h=h.replace(/\b(\d+\.?\d*)\b/g,'<span class="num">$1</span>');
  h=h.replace(/([a-zA-Z_]\w*)(?=\s*\()/g,'<span class="fn">$1</span>');
  return h;
}
function doHighlight(){const code=$('content').value;const lang=$('lang').value;const lines=code.split('\n');let out='';for(let i=0;i<lines.length;i++){out+='<div class="line"><div class="ln">'+(i+1)+'</div><div class="lc">'+(highlight(lines[i],lang)||' ')+'</div></div>';}$('preview').innerHTML=out;}
function toast(msg,type){if(!type)type='ok';const t=document.createElement('div');t.className='toast '+type;t.innerHTML='<div>'+(type==='ok'?'✅':type==='warn'?'⚠️':'❌')+'</div><div>'+msg+'</div>';$('toasts').appendChild(t);setTimeout(()=>{t.style.opacity='0';setTimeout(()=>t.remove(),300);},3500);}
function showModal(o){return new Promise(res=>{$('mIcon').textContent=o.icon;$('mTitle').textContent=o.title;$('mMsg').innerHTML=o.msg;$('mMeta').textContent=o.meta||'';$('mMeta').style.display=o.meta?'inline-flex':'none';$('mOk').textContent=o.okText;$('mOk').className='btn '+o.okClass;$('mCancel').textContent=o.cancelText;$('overlay').classList.add('show');const close=v=>{$('overlay').classList.remove('show');res(v);};$('mOk').onclick=()=>close(true);$('mCancel').onclick=()=>close(false);$('overlay').onclick=e=>{if(e.target.id==='overlay')close(false);};});}
function setMode(m){if(curIsTrash&&m==='view'){toast('Preview restricted in Trash','warn');$('trashLock').classList.add('show');return;}mode=m;$('btnEdit').classList.toggle('active',m==='edit');$('btnView').classList.toggle('active',m==='view');$('content').style.display=m==='edit'?'block':'none';$('preview').style.display=m==='view'?'block':'none';if(m==='view')doHighlight();}
function setTab(t){tab=t;$('tabAll').classList.toggle('active',t==='all');$('tabTrash').classList.toggle('active',t==='trash');$('bulkBar').style.display=t==='trash'?'grid':'none';render();}
async function moveToTrash(p){await dbPut(TRASH_STORE,{...p,deletedAt:Date.now(),trashExpiresAt:Date.now()+24*60*60*1000});await dbDel(STORE,p.id);}
async function cleanExpired(){const now=Date.now();for(const p of pastes){if(p.expiresAt&&now>p.expiresAt){await moveToTrash(p);if(cur===p.id){cur=null;newPaste();}}}for(const t of trash){if(t.trashExpiresAt&&now>t.trashExpiresAt){await dbDel(TRASH_STORE,t.id);}}}
async function load(){pastes=await dbGetAll(STORE);trash=await dbGetAll(TRASH_STORE);await cleanExpired();pastes=await dbGetAll(STORE);trash=await dbGetAll(TRASH_STORE);pastes.sort((a,b)=>b.updated-a.updated);trash.sort((a,b)=>b.deletedAt-a.deletedAt);$('countAll').textContent='('+pastes.length+')';$('countTrash').textContent='('+trash.length+')';render();}
function updateBar(){
  const bar=$('actionBar'); const saveBtn=$('btnSave'); const titleInput=$('title'), langSel=$('lang'), expSel=$('expire'), editBtn=$('btnEdit'), viewBtn=$('btnView'), contentArea=$('content');
  if(curIsTrash){
    bar.classList.add('trash-mode');bar.innerHTML='<button class="btn ok" onclick="restoreCurrent()">♻️ Restore</button><button class="btn danger" onclick="deleteForeverCurrent()">💥 Delete Forever</button><div class="stat" id="stat">Save & Preview disabled • Restore to edit</div>';
    saveBtn.disabled=true;titleInput.disabled=true;langSel.disabled=true;expSel.disabled=true;viewBtn.disabled=true;contentArea.readOnly=true;contentArea.style.filter='blur(6px)';$('preview').style.filter='blur(6px)';
  }else{
    bar.classList.remove('trash-mode');bar.innerHTML='<button class="btn p" onclick="copyAll()">📋 Copy</button><button class="btn" onclick="copyLink()">🔗 Link</button><button class="btn" onclick="download()">⬇️ Download</button><button class="btn danger" onclick="del()">🗑️ Delete</button><div class="stat" id="stat">0 / 1MB</div>';
    saveBtn.disabled=false;titleInput.disabled=false;langSel.disabled=false;expSel.disabled=false;editBtn.disabled=false;viewBtn.disabled=false;contentArea.readOnly=false;contentArea.style.filter='none';$('preview').style.filter='none';
  }
}
function newPaste(){cur=null;curIsTrash=false;$('title').value='';$('content').value='';$('linkBox').classList.remove('show');$('trashLock').classList.remove('show');updateBar();location.hash='';$('countdown').textContent='00:00:00';setMode('edit');update();}
async function savePaste(){if(curIsTrash){toast('❌ Cannot save in trash - Restore first','err');$('trashLock').classList.add('show');return;}const c=$('content').value;if(!c.trim()){toast('Empty','warn');return;}if(sizeOf(c)>MAX){toast('Over 1MB','err');return;}let id=(cur&&!curIsTrash)?cur:makeId($('title').value);const expMin=parseInt($('expire').value);const expiresAt=expMin>0?Date.now()+expMin*60*1000:null;const p={id,title:$('title').value||'Untitled',lang:$('lang').value,content:c,size:sizeOf(c),updated:Date.now(),expiresAt,expireLabel:$('expire').options[$('expire').selectedIndex].text};await dbPut(STORE,p);cur=id;curIsTrash=false;location.hash=id;$('linkBox').classList.add('show');$('linkInput').value=getLink(id);await load();update();toast('Saved!','ok');setMode('view');}

function render(){
  const q=$('q').value.trim(); const qLower=q.toLowerCase();
  if(tab==='all'){
    const f=pastes.filter(p=>(p.title+p.id+p.content).toLowerCase().includes(qLower));
    let h='';for(const p of f){const rem=p.expiresAt?p.expiresAt-Date.now():null;const txt=rem===null?'Never':toHHMMSS(rem);const titleHtml=highlightSearch(p.title,q);h+='<div class="item '+(p.id===cur&&!curIsTrash?'active':'')+'" onclick="openPaste(\''+p.id+'\',false)"><b>'+titleHtml+'</b><br><small>'+fmt(p.size)+' • '+p.lang+'</small><div><span class="badge live">'+txt+'</span></div></div>';}
    $('list').innerHTML=h||'<div style="padding:20px;text-align:center;color:#666">No pastes</div>';
  }else{
    const f=trash.filter(p=>(p.title+p.id+p.content).toLowerCase().includes(qLower));
    let h='';for(const p of f){const timer=toHHMMSS(p.trashExpiresAt-Date.now());const titleHtml=highlightSearch(p.title,q);h+='<div class="item trash-item '+(p.id===cur&&curIsTrash?'active':'')+'" onclick="openPaste(\''+p.id+'\',true)"><b>'+titleHtml+'</b><br><small>'+fmt(p.size)+' • Locked</small><div><span class="badge warn">🔒 '+timer+'</span></div><div class="trash-btns"><button class="btn ok" onclick="event.stopPropagation();restorePaste(\''+p.id+'\')">♻️ Restore</button><button class="btn danger" onclick="event.stopPropagation();deleteForever(\''+p.id+'\')">💥 Forever</button></div></div>';}
    $('list').innerHTML=h||'<div style="padding:20px;text-align:center;color:#666">Trash empty<br><small>Search works inside content too</small></div>';
  }
}

async function openPaste(id,isTrash){let p=isTrash?trash.find(x=>x.id===id):pastes.find(x=>x.id===id);if(!p){p=await dbGet(isTrash?TRASH_STORE:STORE,id);}if(!p){toast('Not found','err');return;}cur=id;curIsTrash=isTrash;$('title').value=p.title;$('lang').value=p.lang;$('content').value=p.content;if(isTrash){$('trashLock').classList.add('show');$('countdown').textContent='🔒 '+toHHMMSS(p.trashExpiresAt-Date.now());const lt=$('lockTimer');if(lt)lt.textContent=toHHMMSS(p.trashExpiresAt-Date.now())+' until delete';updateBar();setMode('edit');}else{if(p.expiresAt&&Date.now()>p.expiresAt){await moveToTrash(p);await load();return;}$('trashLock').classList.remove('show');updateBar();location.hash=id;$('linkBox').classList.add('show');$('linkInput').value=getLink(id);setMode('view');}document.getElementById('side').classList.remove('open');render();update();}
function update(){const b=sizeOf($('content').value);const fill=$('fill');if(fill)fill.style.width=Math.min(100,b/MAX*100)+'%';const stat=$('stat');if(stat&&!curIsTrash)stat.textContent=fmt(b)+' / 1MB • '+$('content').value.split('\n').length+' lines • '+$('lang').value;if(cur&&!curIsTrash){const p=pastes.find(x=>x.id===cur);if(p&&p.expiresAt){$('countdown').textContent=toHHMMSS(p.expiresAt-Date.now());}}else if(cur&&curIsTrash){const p=trash.find(x=>x.id===cur);if(p){const rem=p.trashExpiresAt-Date.now();$('countdown').textContent='🔒 '+toHHMMSS(rem);const lt=$('lockTimer');if(lt)lt.textContent=toHHMMSS(rem)+' until delete';}}if(mode==='view'&&!curIsTrash)doHighlight();}
async function del(){if(!cur){toast('No paste','warn');return;}if(curIsTrash){deleteForever(cur);return;}const p=pastes.find(x=>x.id===cur);const ok=await showModal({icon:'🗑️',title:'Move to Trash?',msg:'<b>'+esc(p.title)+'</b> will be moved to trash.<br>Save & Preview disabled until restored.',meta:fmt(p.size)+' • #'+p.id,okText:'Move to Trash',okClass:'danger',cancelText:'Keep'});if(!ok)return;await moveToTrash(p);await load();toast('Moved to trash','warn');cur=null;newPaste();}
async function deleteForever(id){const p=trash.find(x=>x.id===id)||await dbGet(TRASH_STORE,id);if(!p)return;const ok=await showModal({icon:'💥',title:'Delete Forever?',msg:'<b>'+esc(p.title)+'</b> will be permanently deleted.',meta:fmt(p.size)+' • #'+p.id,okText:'Delete Forever',okClass:'danger',cancelText:'Cancel'});if(!ok)return;await dbDel(TRASH_STORE,id);if(cur===id){cur=null;newPaste();}await load();toast('Permanently deleted','err');}
function deleteForeverCurrent(){if(curIsTrash)deleteForever(cur);}
async function restorePaste(id){const p=trash.find(x=>x.id===id)||await dbGet(TRASH_STORE,id);if(!p)return;const ok=await showModal({icon:'♻️',title:'Restore?',msg:'<b>'+esc(p.title)+'</b> will be restored with 24h expiry.',meta:fmt(p.size)+' • #'+p.id,okText:'Restore',okClass:'ok',cancelText:'Cancel'});if(!ok)return;const r={...p,updated:Date.now(),expiresAt:Date.now()+24*60*60*1000,expireLabel:'24 hours'};delete r.deletedAt;delete r.trashExpiresAt;await dbPut(STORE,r);await dbDel(TRASH_STORE,id);await load();toast('Restored ✅','ok');if(cur===id){setTab('all');openPaste(id,false);}}

// --- NEW 3 FEATURES ---
async function restoreAll(){
  if(trash.length===0){toast('Trash empty','warn');return;}
  const ok=await showModal({icon:'♻️',title:'Restore All?',msg:'Restore <b>'+trash.length+' pastes</b> from trash?<br>All will get 24h expiry.',meta:trash.length+' items',okText:'Restore All',okClass:'ok',cancelText:'Cancel'});
  if(!ok)return;
  for(const p of [...trash]){const r={...p,updated:Date.now(),expiresAt:Date.now()+24*60*60*1000,expireLabel:'24 hours'};delete r.deletedAt;delete r.trashExpiresAt;await dbPut(STORE,r);await dbDel(TRASH_STORE,p.id);}
  await load();toast('Restored '+trash.length+' pastes ✅','ok');setTab('all');
}
async function emptyTrash(){
  if(trash.length===0){toast('Trash empty','warn');return;}
  const ok=await showModal({icon:'💥',title:'Empty Trash?',msg:'Permanently delete <b>'+trash.length+' pastes</b>?<br>This cannot be undone!',meta:trash.length+' items • Forever',okText:'Empty Trash',okClass:'danger',cancelText:'Keep'});
  if(!ok)return;
  await dbClear(TRASH_STORE);cur=null;newPaste();await load();toast('Trash emptied 💥','err');
}
async function exportZip(){
  if(pastes.length===0 && trash.length===0){toast('Nothing to export','warn');return;}
  if(typeof JSZip==='undefined'){toast('Zip lib not loaded - check internet','err');return;}
  const zip=new JSZip();
  const folderPastes=zip.folder('pastes');
  const folderTrash=zip.folder('trash');
  for(const p of pastes){folderPastes.file((p.title||p.id).replace(/[^a-z0-9-_]/gi,'_')+'.'+p.lang+'.txt', p.content);}
  for(const t of trash){folderTrash.file((t.title||t.id).replace(/[^a-z0-9-_]/gi,'_')+'.'+t.lang+'.txt', t.content);}
  zip.file('index.json', JSON.stringify({exportedAt:new Date().toISOString(), pastes:pastes.map(p=>({id:p.id,title:p.title,size:p.size,lang:p.lang,expiresAt:p.expiresAt})), trash:trash.map(t=>({id:t.id,title:t.title,size:t.size,deletedAt:t.deletedAt,trashExpiresAt:t.trashExpiresAt}))}, null, 2));
  const blob=await zip.generateAsync({type:'blob'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='MyPaste-Export-'+new Date().toISOString().slice(0,10)+'.zip';a.click();
  toast('Exported '+ (pastes.length+trash.length) +' files as zip 📦','ok');
}

function restoreCurrent(){if(curIsTrash)restorePaste(cur);}
async function copyAll(){if(curIsTrash){toast('Copy disabled in trash','warn');$('trashLock').classList.add('show');return;}await navigator.clipboard.writeText($('content').value);toast('Copied! ✅','ok');}
function copyLink(){if(curIsTrash||!cur){toast(curIsTrash?'Link disabled in trash':'Save first','warn');return;}navigator.clipboard.writeText(getLink(cur)).then(()=>toast('Link copied 🔗','ok'));}
function download(){if(curIsTrash){toast('Download disabled in trash','warn');return;}const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([$('content').value]));a.download=($('title').value||cur)+'.txt';a.click();toast('Downloaded 📥','ok');}
$('content').addEventListener('input',update);
setInterval(()=>{render();update();},1000);
setInterval(()=>{cleanExpired().then(()=>load());},30000);
window.addEventListener('DOMContentLoaded',async()=>{await load();update();const h=location.hash.slice(1);if(h)openPaste(h,false);else{setMode('edit');updateBar();}});
</script>
