<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Canapnapan</title>
  <link rel="icon" href="icon-512.png" type="image/png">
  <link rel="apple-touch-icon" href="icon-512.png">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#a855f7">
  <style>
    *{margin:0;padding:0;box-sizing:border-box;font-family:Inter,system-ui,sans-serif}
    body{background:#0b0b14;color:#fff;height:100dvh;display:flex;flex-direction:column;overflow:hidden}
    header{height:64px;background:#15152a;display:flex;align-items:center;gap:12px;padding:0 14px;border-bottom:1px solid #23233d;flex-shrink:0;z-index:30}
    .menu{width:48px;height:48px;border-radius:14px;background:#1c1c33;border:1px solid #2a2a4a;display:grid;place-items:center;cursor:pointer;font-size:22px}
    .logo{width:44px;height:44px;border-radius:14px;object-fit:cover;flex-shrink:0;border:1px solid #2a2a4a;background:#111126}
    .login-logo{width:72px;height:72px;border-radius:22px;margin:0 auto 16px;display:block;object-fit:cover;border:1px solid #2a2a4a}
    .h-title{font-weight:800;font-size:18px} .h-room{color:#8b8ba7;margin-left:6px;font-weight:500}
    .h-live{margin-left:auto;color:#8b8ba7;font-size:12px;letter-spacing:1px}
    .bell,.trash{width:48px;height:48px;border-radius:14px;background:#1c1c33;border:1px solid #2a2a4a;display:grid;place-items:center;cursor:pointer}
    .bell.on{background:linear-gradient(135deg,#a855f7,#ec4899);border-color:transparent}
    .bell .dot{position:absolute;top:-4px;right:-4px;background:#ff4d6a;color:#fff;font-size:10px;font-weight:800;min-width:18px;height:18px;border-radius:9px;display:none;place-items:center;padding:0 4px}
    .bell .dot.show{display:grid}
    .app{flex:1;display:flex;overflow:hidden;position:relative}
    .rooms{width:85%;max-width:340px;background:#111126;border-right:1px solid #23233d;display:flex;flex-direction:column;padding:18px 14px;gap:12px;position:absolute;left:0;top:0;bottom:0;z-index:20;transform:translateX(-100%);transition:.3s ease;overflow-y:auto}
    .rooms.open{transform:translateX(0)} .rooms-head{display:flex;justify-content:space-between;align-items:center}
    .add{width:46px;height:46px;border-radius:14px;background:linear-gradient(135deg,#a855f7,#ec4899);border:none;color:#fff;font-size:22px;font-weight:700;cursor:pointer}
    .room{padding:18px 16px;border-radius:18px;background:#1a1a35;border:1px solid #2a2a4a;color:#d0d0e6;font-size:16px;cursor:pointer;text-align:left;width:100%}
    .room.active{background:linear-gradient(135deg,#8b5cf6,#ec4899);color:#fff;font-weight:700}
    .online{margin-top:8px;color:#6b6b8a;font-size:12px;letter-spacing:1.5px;font-weight:700}
    .online-list{display:flex;flex-direction:column;gap:8px;margin-top:8px}
    .online-user{display:flex;align-items:center;gap:10px;background:#1a1a35;border:1px solid #2a2a4a;padding:10px 12px;border-radius:14px;font-size:14px}
    .online-dot{width:10px;height:10px;background:#22c55e;border-radius:50%;box-shadow:0 0 8px #22c55e;flex-shrink:0}
    .userbar{display:flex;gap:10px;padding:12px;background:#0f0f23;border-top:1px solid #23233d;margin-top:auto}
    .userbar input{flex:1;background:#1a1a35;border:1px solid #2a2a4a;color:#fff;padding:14px 16px;border-radius:16px;outline:none}
    .userbar button{width:76px;height:46px;border-radius:16px;background:linear-gradient(135deg,#a855f7,#ec4899);border:none;color:#fff;font-weight:800;cursor:pointer}
    .chat{flex:1;display:flex;flex-direction:column;background:#0b0b14;min-width:0;width:100%}
    #messages{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:10px}
    .msg{background:#1a1a35;padding:12px 14px;border-radius:16px;max-width:85%;align-self:flex-start}
    .msg.me{background:linear-gradient(135deg,#a855f7,#ec4899);align-self:flex-end;border-bottom-right-radius:4px}
    .msg .name{font-size:11px;opacity:.7;font-weight:700;margin-bottom:2px} .msg .text{font-size:14px;word-break:break-word}
    #form{padding:12px;display:flex;gap:10px;background:#0f0f23;border-top:1px solid #23233d;flex-shrink:0}
    #form input{flex:1;background:#1a1a35;border:1px solid #2a2a4a;color:#fff;padding:16px;border-radius:16px;outline:none;font-size:16px}
    #form button{width:58px;height:52px;border-radius:16px;background:linear-gradient(135deg,#a855f7,#ec4899);border:none;color:#fff;font-weight:800;cursor:pointer}
    .backdrop{position:absolute;inset:0;background:rgba(0,0,0,.5);z-index:15;display:none} .backdrop.show{display:block}
    #login{position:fixed;inset:0;background:#0b0b14;z-index:50;display:flex;align-items:center;justify-content:center;padding:24px}
    .login-card{background:#15152a;border:1px solid #2a2a4a;border-radius:24px;padding:28px;width:100%;max-width:360px;text-align:center}
    .login-card input{width:100%;background:#1a1a35;border:1px solid #2a2a4a;color:#fff;padding:16px;border-radius:14px;outline:none;margin-top:18px}
    .login-card button{width:100%;padding:16px;border-radius:14px;background:linear-gradient(135deg,#a855f7,#ec4899);border:none;color:#fff;font-weight:800;cursor:pointer;margin-top:12px}
    .error-text{color:#ff7a90;font-size:12px;margin-top:8px;min-height:16px;text-align:left}
    #toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%) translateY(20px);background:#15152a;border:1px solid #2a2a4a;padding:14px 20px;border-radius:16px;font-size:13px;color:#fff;opacity:0;pointer-events:none;transition:.35s;z-index:100;display:flex;gap:10px;align-items:center}
    #toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
    .modal{position:fixed;inset:0;background:rgba(0,0,0,.7);backdrop-filter:blur(8px);z-index:60;display:none;align-items:center;justify-content:center;padding:24px}
    .modal.open{display:flex} .modal-card{background:#15152a;border:1px solid #2a2a4a;border-radius:24px;padding:24px;width:100%;max-width:360px}
    .modal-card input{width:100%;background:#1a1a35;border:1px solid #2a2a4a;color:#fff;padding:14px;border-radius:12px;outline:none;margin-top:14px}
    .modal-actions{display:flex;gap:10px;margin-top:18px} .modal-actions button{flex:1;padding:14px;border-radius:14px;border:none;font-weight:700;cursor:pointer}
    .btn-cancel{background:#1a1a35;color:#d0d0e6;border:1px solid #2a2a4a!important}
    .btn-danger{background:linear-gradient(135deg,#ff4d6a,#ff7a45);color:#fff}
    .btn-create{background:linear-gradient(135deg,#a855f7,#ec4899);color:#fff}
    @media(min-width:768px){.rooms{position:relative;transform:translateX(0)} .backdrop{display:none!important} .menu{display:none}}

    /* LOADING SCREEN - EXTERNAL ICON */
    #loadingScreen{position:fixed;inset:0;background:#0b0b14;z-index:9999;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:28px;transition:opacity .6s ease,visibility .6s ease}
    #loadingScreen.hide{opacity:0;visibility:hidden;pointer-events:none}
    .loader-wrap{width:180px;height:180px;border-radius:40px;background:#111126;border:1px solid #23233d;display:grid;place-items:center;box-shadow:0 20px 60px rgba(0,0,0,.6);overflow:hidden}
    .loader-icon{width:160px;height:160px;position:relative;display:grid;place-items:center}
    .loader-icon img{width:160px;height:160px;object-fit:cover;border-radius:32px;position:absolute;inset:0}
    .loader-icon img.dim{filter:grayscale(1) brightness(0.25);opacity:0.5}
    .loader-icon .fill-layer{position:absolute;inset:0;overflow:hidden;clip-path:inset(100% 0 0 0);animation:fillC 2.4s cubic-bezier(.65,0,.35,1) forwards;border-radius:32px}
    @keyframes fillC{0%{clip-path:inset(100% 0 0 0)}12%{clip-path:inset(85% 0 0 0)}38%{clip-path:inset(48% 0 0 0)}72%{clip-path:inset(12% 0 0 0)}100%{clip-path:inset(0% 0 0 0)}}
    .loader-text{font-weight:800;font-size:22px;background:linear-gradient(135deg,#a855f7,#ec4899);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;opacity:0;animation:fadeUp .6s .4s forwards}
    @keyframes fadeUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
    .loader-dots{display:flex;gap:7px} .loader-dots span{width:6px;height:6px;border-radius:50%;background:#a855f7;animation:bounce 1.2s infinite}
    .loader-dots span:nth-child(2){animation-delay:.15s;background:#c084fc} .loader-dots span:nth-child(3){animation-delay:.3s;background:#ec4899}
    @keyframes bounce{0%,80%,100%{transform:scale(.6);opacity:.4}40%{transform:scale(1.1);opacity:1}}
  </style>
</head>
<body>

  <!-- LOADING SCREEN - USES YOUR icon-512.png -->
  <div id="loadingScreen">
    <div class="loader-wrap">
      <div class="loader-icon">
        <img class="dim" src="icon-512.png" alt="C dim" onerror="this.style.display='none'">
        <div class="fill-layer">
          <img src="icon-512.png" alt="C fill" onerror="this.style.display='none'">
        </div>
      </div>
    </div>
    <div class="loader-text">Canapnapan</div>
    <div class="loader-dots"><span></span><span></span><span></span></div>
  </div>

  <header>
    <div class="menu" id="menuBtn">☰</div>
    <img src="icon-512.png" class="logo" alt="Canapnapan" onerror="this.style.background='#111126'">
    <div class="h-title">Canapnapan <span class="h-room" id="hRoom"># general</span></div>
    <div class="h-live">LIVE</div>
    <div class="bell" id="bellBtn" style="position:relative">🔔<span class="dot" id="bellDot">0</span></div>
    <button class="trash" id="clearBtn" title="Clear">🗑️</button>
  </header>

  <div class="app">
    <div class="backdrop" id="backdrop"></div>
    <div class="rooms open" id="roomsPanel">
      <div class="rooms-head"><h3>Rooms</h3><button type="button" class="add" id="addRoom">+</button></div>
      <button type="button" class="room active" data-room="general"># general</button>
      <button type="button" class="room" data-room="gaming"># gaming</button>
      <button type="button" class="room" data-room="school"># school</button>
      <button type="button" class="room" data-room="random"># random</button>
      <button type="button" class="room" data-room="music"># music</button>
      <div class="online">ONLINE — REAL FRIENDS</div>
      <div id="onlineList" class="online-list"><div style="color:#6b6b8a;font-size:13px">No one online yet...</div></div>
      <div style="flex:1"></div>
      <div class="userbar"><input id="usernameDisplay" placeholder="Username"><button type="button" id="okBtn">OK</button></div>
    </div>
    <div class="chat"><div id="messages"></div><form id="form"><input id="msgInput" placeholder="Message #general..." autocomplete="off"><button type="submit">➤</button></form></div>
  </div>

  <div id="login">
    <div class="login-card">
      <img src="icon-512.png" class="login-logo" alt="Canapnapan">
      <h2>Welcome to Canapnapan</h2>
      <p style="color:#8b8ba7;font-size:14px">Enter your name to start</p>
      <input id="loginName" placeholder="Your name e.g. Adam" maxlength="20">
      <div class="error-text" id="loginError"></div>
      <button type="button" id="enterBtn">Enter Chat</button>
    </div>
  </div>

  <div class="modal" id="roomModal"><div class="modal-card"><h3>Create Room</h3><input id="newRoomInput" placeholder="e.g. music" maxlength="12"><div class="error-text" id="roomError"></div><div class="modal-actions"><button class="btn-cancel" id="cancelRoom">Cancel</button><button class="btn-create" id="createRoom">Create</button></div></div></div>
  <div class="modal" id="clearModal"><div class="modal-card" style="border-color:#ff4d6a44"><h3>Clear #<span id="clearRoomName">general</span>?</h3><p>This only clears for YOU.</p><div class="modal-actions"><button class="btn-cancel" id="cancelClear">Keep</button><button class="btn-danger" id="confirmClear">Clear for me</button></div></div></div>
  <div id="toast"><span>✓</span><span id="toastMsg">Saved</span></div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
    import { getFirestore, collection, addDoc, query, orderBy, onSnapshot, serverTimestamp, doc, setDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
    const firebaseConfig = {apiKey:"AIzaSyD09xOg1vN1x4aPvKeVsldtw7A-Cl98JSQ",authDomain:"chatty-2d263.firebaseapp.com",projectId:"chatty-2d263",storageBucket:"chatty-2d263.firebasestorage.app",messagingSenderId:"27523089461",appId:"1:27523089461:web:65fd0a6fa365c7ba895d7c"};
    const app=initializeApp(firebaseConfig); const db=getFirestore(app);
    let username=localStorage.getItem("chatty_name")||""; let currentRoom=localStorage.getItem("chatty_room")||"general";
    let notifEnabled=localStorage.getItem("chatty_notif")==="on"; let unread=0; let lastMsgCount=0; let isFirstLoad=true;
    const loginDiv=document.getElementById("login"),loginName=document.getElementById("loginName"),loginError=document.getElementById("loginError");
    const usernameDisplay=document.getElementById("usernameDisplay"),hRoom=document.getElementById("hRoom"),msgInput=document.getElementById("msgInput"),messagesDiv=document.getElementById("messages");
    const toast=document.getElementById("toast"),toastMsg=document.getElementById("toastMsg"),roomModal=document.getElementById("roomModal"),newRoomInput=document.getElementById("newRoomInput"),roomError=document.getElementById("roomError");
    const roomsPanel=document.getElementById("roomsPanel"),backdrop=document.getElementById("backdrop"),menuBtn=document.getElementById("menuBtn");
    const bellBtn=document.getElementById("bellBtn"),bellDot=document.getElementById("bellDot"),clearModal=document.getElementById("clearModal"),onlineList=document.getElementById("onlineList");
    function updateBellUI(){bellBtn.classList.toggle("on",notifEnabled);if(unread>0){bellDot.textContent=unread>9?"9+":unread;bellDot.classList.add("show")}else{bellDot.classList.remove("show")}}
    updateBellUI(); function toggleRooms(show){if(show===undefined)roomsPanel.classList.toggle("open");else if(show)roomsPanel.classList.add("open");else roomsPanel.classList.remove("open");backdrop.classList.toggle("show",roomsPanel.classList.contains("open")&&window.innerWidth<768)}
    menuBtn.addEventListener("click",()=>toggleRooms()); backdrop.addEventListener("click",()=>toggleRooms(false));
    function showToast(msg){toastMsg.textContent=msg;toast.classList.add("show");setTimeout(()=>toast.classList.remove("show"),2800)}
    function showError(input,errorEl,msg){input.style.borderColor="#ff4d6a";errorEl.textContent=msg}
    function clearError(input,errorEl){input.style.borderColor="";errorEl.textContent=""}
    function showApp(){if(!username)return;loginDiv.style.display="none";usernameDisplay.value=username;hRoom.textContent="# "+currentRoom;msgInput.placeholder="Message #"+currentRoom+"...";document.querySelectorAll(".room").forEach(r=>r.classList.toggle("active",r.dataset.room===currentRoom));if(window.innerWidth<768)toggleRooms(false);unread=0;updateBellUI();startPresence()}
    if(username)showApp();
    bellBtn.addEventListener("click",async()=>{if(!notifEnabled){if("Notification" in window){const perm=await Notification.requestPermission();if(perm!=="granted"){showToast("🔕 Blocked by browser");return}}notifEnabled=true;localStorage.setItem("chatty_notif","on");unread=0;updateBellUI();showToast("Notifications ON 🔔")}else{notifEnabled=false;localStorage.setItem("chatty_notif","off");unread=0;updateBellUI();showToast("Notifications OFF")}});
    document.addEventListener("visibilitychange",()=>{if(!document.hidden){unread=0;updateBellUI();if(username)updatePresence()}});
    document.getElementById("enterBtn").addEventListener("click",()=>{const n=loginName.value.trim();if(!n){showError(loginName,loginError,"We need your name");return}if(n.length<2){showError(loginName,loginError,"At least 2 letters");return}clearError(loginName,loginError);username=n;localStorage.setItem("chatty_name",n);showApp();listen();listenPresence();showToast("Welcome, "+n+"!")});
    document.getElementById("okBtn").addEventListener("click",()=>{const n=usernameDisplay.value.trim();if(!n||n.length<2){showToast("Too short");return}username=n;localStorage.setItem("chatty_name",n);updatePresence();showToast("Username → "+n+" ✓")});
    document.querySelectorAll(".room").forEach(btn=>{btn.addEventListener("click",()=>{currentRoom=btn.dataset.room;localStorage.setItem("chatty_room",currentRoom);showApp();listen();updatePresence()})});
    function openRoomModal(){roomModal.classList.add("open");newRoomInput.value="";roomError.textContent="";newRoomInput.focus()} function closeRoomModal(){roomModal.classList.remove("open")}
    document.getElementById("addRoom").addEventListener("click",openRoomModal); document.getElementById("cancelRoom").addEventListener("click",closeRoomModal);
    document.getElementById("createRoom").addEventListener("click",()=>{let r=newRoomInput.value.trim().toLowerCase();if(!r){showError(newRoomInput,roomError,"Need a name");return}const clean=r.replace(/[^a-z0-9]/g,"").slice(0,12);if(!clean){showError(newRoomInput,roomError,"Letters only");return}if(document.querySelector(`[data-room="${clean}"]`)){closeRoomModal();currentRoom=clean;localStorage.setItem("chatty_room",clean);showApp();listen();return}const nb=document.createElement("button");nb.type="button";nb.className="room";nb.dataset.room=clean;nb.textContent="# "+clean;nb.addEventListener("click",()=>{currentRoom=clean;localStorage.setItem("chatty_room",clean);showApp();listen()});document.getElementById("roomsPanel").insertBefore(nb,document.getElementById("roomsPanel").children[5]);currentRoom=clean;localStorage.setItem("chatty_room",clean);showApp();listen();closeRoomModal();showToast("Room #"+clean+" created!")});
    const clearBtn=document.getElementById("clearBtn"); clearBtn.addEventListener("click",()=>{document.getElementById("clearRoomName").textContent=currentRoom;clearModal.classList.add("open")});
    document.getElementById("cancelClear").addEventListener("click",()=>clearModal.classList.remove("open")); clearModal.addEventListener("click",(e)=>{if(e.target===clearModal)clearModal.classList.remove("open")});
    document.getElementById("confirmClear").addEventListener("click",async()=>{const btn=document.getElementById("confirmClear");try{btn.textContent="Clearing...";btn.disabled=true;const clearKey=`chatty_cleared_${currentRoom}_${username}`;localStorage.setItem(clearKey,Date.now().toString());messagesDiv.innerHTML=`<div style="text-align:center;color:#6b6b8a;margin-top:40px;font-size:14px">Chat cleared for you in #${currentRoom}<br>Others still see history.</div>`;showToast(`#${currentRoom} cleared for you ✓`);clearModal.classList.remove("open");setTimeout(()=>{listen()},300)}catch(err){showToast("Failed")}finally{btn.textContent="Clear for me";btn.disabled=false}});
    let presenceInterval=null; async function updatePresence(){if(!username)return;try{await setDoc(doc(db,"presence",username),{name:username,room:currentRoom,lastSeen:Date.now(),online:true},{merge:true})}catch(e){console.log("presence error",e)}}
    function startPresence(){updatePresence();if(presenceInterval)clearInterval(presenceInterval);presenceInterval=setInterval(updatePresence,30000)}
    function listenPresence(){const col=collection(db,"presence");const q=query(col,orderBy("lastSeen","desc"));onSnapshot(q,(snap)=>{onlineList.innerHTML="";const now=Date.now();let count=0;snap.forEach(d=>{const u=d.data();if(!u.name)return;if(now-u.lastSeen>120000)return;count++;const div=document.createElement("div");div.className="online-user";const isMe=u.name===username;div.innerHTML=`<span class="online-dot"></span><span style="flex:1">${u.name}${isMe?' (you)':''}</span><span style="color:#6b6b8a;font-size:11px">#${u.room||'general'}</span>`;onlineList.appendChild(div)});if(count===0){onlineList.innerHTML=`<div style="color:#6b6b8a;font-size:13px">No one online... invite friends!</div>`}})}
    if(username){listenPresence()} let unsub=null; function listen(){if(unsub)unsub();const col=collection(db,"messages");const q=query(col,orderBy("createdAt","asc"));unsub=onSnapshot(q,(snap)=>{const clearKey=`chatty_cleared_${currentRoom}_${username}`;const clearedAt=parseInt(localStorage.getItem(clearKey)||"0");const all=[];snap.forEach(d=>{const m=d.data();const room=(m.room||"general").toLowerCase();if(room!==currentRoom)return;let msgTime=0;if(m.createdAt&&m.createdAt.toMillis)msgTime=m.createdAt.toMillis();else if(m.createdAt&&m.createdAt.seconds)msgTime=m.createdAt.seconds*1000;if(clearedAt>0&&msgTime>0&&msgTime<clearedAt)return;if(clearedAt>0&&msgTime===0)return;all.push(m)});messagesDiv.innerHTML="";if(all.length===0){messagesDiv.innerHTML=`<div style="text-align:center;color:#6b6b8a;margin-top:40px;font-size:14px">No messages in #${currentRoom}<br>Start chatting! 👋</div>`}else{all.forEach(m=>{const div=document.createElement("div");div.className="msg"+(m.name===username?" me":"");div.innerHTML=`<div class="name">${m.name}</div><div class="text">${(m.text||"").replace(/</g,"&lt;")}</div>`;messagesDiv.appendChild(div)})}messagesDiv.scrollTop=messagesDiv.scrollHeight;if(!isFirstLoad&&all.length>lastMsgCount){const newMsgs=all.slice(lastMsgCount);newMsgs.forEach(m=>{if(m.name!==username){if(document.hidden){unread++;updateBellUI()}if(notifEnabled&&Notification.permission==="granted"){new Notification(`#${currentRoom} • ${m.name}`,{body:m.text,icon:"icon-512.png"})}}})}lastMsgCount=all.length;isFirstLoad=false})}
    if(username){isFirstLoad=true;listen()}
    document.getElementById("form").addEventListener("submit",async e=>{e.preventDefault();const t=msgInput.value.trim();if(!t||!username)return;msgInput.value="";try{await addDoc(collection(db,"messages"),{name:username,text:t,room:currentRoom,createdAt:serverTimestamp()});updatePresence()}catch(err){showToast("❌ Failed to send")}});
    window.addEventListener("beforeunload",()=>{if(presenceInterval)clearInterval(presenceInterval)});
  </script>
  <script>if('serviceWorker' in navigator){navigator.serviceWorker.register('sw.js');}</script>
  <script>
    (function(){
      const loader=document.getElementById('loadingScreen');
      let done=false;
      function hideLoader(){if(done)return;done=true;loader.classList.add('hide');setTimeout(function(){if(loader)loader.remove()},700)}
      setTimeout(hideLoader,2800);
      window.addEventListener('load',function(){setTimeout(hideLoader,1200)});
    })();
  </script>
</body>
</html>
